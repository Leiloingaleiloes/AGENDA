<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E6A3E">
<title>Previsão do Tempo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: site de computador — faixa superior, agenda por leiloeira à esquerda, painel de tempo fixo à direita */
:root {
  --bg: #EDEEF0;
  --surface: #FFFFFF;
  --surface-2: #F5F6F7;
  --line: #DADDE1;
  --fg: #1D2024;
  --muted: #5D636B;
  --accent: #2E6A3E;
  --accent-soft: #E1EDE3;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --alert: #B42318;
  --alert-soft: #FDE7E4;
  --rain: #2F6FB0;
  --sun: #E0A100;
  --cloud: #A9B4AE;
  --cloud-2: #7D8A83;
  /* cores das leiloeiras: usadas como preenchimento com texto branco */
  --c-leiloinga: #2E6A3E;
  --c-leiloinga-dark: #161B18;
  --c-gralha: #123E7A;
  --c-panorama: #0A8299;
  --c-pampa: #5B6E62;
  --c-todas: #3E4349;
  --on-brand: #FFFFFF;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141517; --surface: #1C1E21; --surface-2: #222529; --line: #31353B; --fg: #E8EAED; --muted: #9DA3AB;
  --accent: #7CC48C; --accent-soft: #1F3326; --warn: #F0B45A; --warn-soft: #3A2C14;
  --alert: #FF8A7A; --alert-soft: #3D1E1A; --rain: #7FB2F0; --sun: #F0C45A; --cloud: #8D9A93; --cloud-2: #66736C;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141517; --surface: #1C1E21; --surface-2: #222529; --line: #31353B; --fg: #E8EAED; --muted: #9DA3AB;
  --accent: #7CC48C; --accent-soft: #1F3326; --warn: #F0B45A; --warn-soft: #3A2C14;
  --alert: #FF8A7A; --alert-soft: #3D1E1A; --rain: #7FB2F0; --sun: #F0C45A; --cloud: #8D9A93; --cloud-2: #66736C;
  color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
a { color: inherit; }
button { font: inherit; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 18px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; }
h1 span { color: var(--accent); }
.brandhead { display: flex; align-items: center; gap: 18px; min-width: 0; }
.logo { height: 52px; width: auto; max-width: 220px; object-fit: contain; display: block; }
@media (max-width: 640px) { .logo { height: 40px; } }
.stamp { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.layout { max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; }
main, aside { min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .07em; margin: 0 0 12px; color: var(--muted); }

/* botões de leiloeira */
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.tab { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); cursor: pointer; display: flex; flex-direction: column; gap: 2px; border-top: 5px solid var(--c); }
.tab .n { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
.tab .c { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { background: var(--cf); color: var(--on-brand); border-color: var(--cf); border-top-color: var(--c); }
.tab[aria-pressed="true"] .c { color: var(--on-brand); opacity: .8; }
.tab:hover { border-color: var(--c); }

/* lista de leilões */
.month { font-family: var(--f-display); font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
.month:first-child { margin-top: 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto auto; gap: 4px 18px; align-items: center; }
.wxb { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; border-radius: 10px; background: var(--surface-2); min-width: 118px; }
.wxb svg { width: 40px; height: 40px; flex: none; }
.wxb .v { line-height: 1.2; font-variant-numeric: tabular-nums; }
.wxb .v b { font-size: .95rem; }
.wxb .v span { display: block; font-size: .76rem; color: var(--muted); }
.wxb .v span.r { color: var(--rain); }
.wxb.na { opacity: .7; }
.item.ours { grid-template-columns: 116px minmax(0, 1fr) auto auto; }
.item.ours .dcol { grid-row: span 2; display: flex; flex-direction: column; gap: 6px; align-self: start; }
.item.ours .dcol .dt { width: 100%; }
.bnr { display: block; width: 116px; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.bnr img { width: 100%; height: 100%; object-fit: cover; display: block; }
.strip { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; margin-top: 6px; }
.mini { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; padding: 5px 4px; border-radius: 8px; background: var(--surface-2); font-variant-numeric: tabular-nums; line-height: 1.15; text-align: center; }
.mini svg { width: 24px; height: 24px; }
.mini .dd { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.mini .tt { font-size: .76rem; font-weight: 600; }
.mini .rr { font-size: .68rem; color: var(--rain); }
.mini.na { opacity: .6; }
.strip .wxb { border: 1px solid var(--line); }
.item.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.item.has-alert .flag { display: inline-block; }
.item { border-left: 5px solid var(--c); }
.dt { text-align: center; font-family: var(--f-display); line-height: 1; background: var(--c); color: var(--on-brand); border-radius: 8px; padding: 8px 4px; }
.dt .d { font-size: 1.9rem; font-weight: 700; display: block; font-variant-numeric: tabular-nums; }
.dt .w { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; opacity: .9; }
.dt .m { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; opacity: .85; margin-top: 2px; }
.brand { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 4px; background: var(--c); color: var(--on-brand); margin-bottom: 3px; }
.info { min-width: 0; }
.nm { font-weight: 600; font-size: 1.02rem; }
.sub { font-size: .88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.sub b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.flag { display: inline-block; margin-top: 4px; font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--alert-soft); color: var(--alert); }
.acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 .86rem var(--f-body); text-decoration: none; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--line); color: var(--fg); background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.yt { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.wx[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn svg { width: 14px; height: 14px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 20px; color: var(--muted); }

/* calendário */
.topr { display: flex; align-items: center; gap: 16px; }
.calbtns { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: -6px 0 20px; }
.calpair { grid-column: span 4; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.calbtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .05em; }
.calbtn svg { width: 20px; height: 20px; flex: none; }
.calbtn:hover { border-color: var(--muted); }
.calbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.calbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.calbar .mt { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; text-transform: uppercase; letter-spacing: .03em; }
.calnav { display: flex; gap: 6px; }
.calwrap { overflow-x: auto; }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--line); gap: 1px; min-width: 770px; }
.calgrid .wd { background: var(--surface-2); font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 8px; text-align: center; }
.cell { background: var(--surface); min-height: 112px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell.out { background: var(--surface-2); }
.cell.out .n { opacity: .45; }
.cell .n { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; line-height: 1; }
.cell.today .n { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center; border-radius: 50%; background: var(--fg); color: var(--bg); }
.cev { display: flex; align-items: flex-start; gap: 4px; text-decoration: none; background: var(--c); color: var(--on-brand); border-radius: 5px; padding: 3px 6px; font-size: .74rem; line-height: 1.2; min-width: 0; }
.cev:hover { filter: brightness(1.1); }
.cev .t { font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.cev { flex-wrap: wrap; align-items: center; }
.cev .c { flex: 1 1 100%; overflow-wrap: anywhere; min-width: 0; }
.cev .ic { flex: none; width: 18px; height: 18px; background: var(--surface); border-radius: 4px; display: inline-flex; }
.cev .ic svg { width: 18px; height: 18px; }
.cev.alert { box-shadow: inset 0 0 0 2px var(--alert); }
.callegend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
.callegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--c); vertical-align: -1px; margin-right: 5px; }

/* painel de tempo */
aside { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.wx-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
.wx-head .lbl { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.wx-head .ev { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; line-height: 1.15; }
.alertbox { background: var(--alert-soft); color: var(--alert); font-size: .88rem; padding: 8px 10px; border-radius: 8px; margin-bottom: 14px; }
.city { margin-bottom: 18px; }
.city-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--fg); margin-bottom: 4px; }
.city-h .cn { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: .03em; }
.city-h .tg { font-size: .76rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.day { display: grid; grid-template-columns: 58px 26px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: .86rem; }
.day:last-child { border-bottom: 0; }
.day.ev { background: var(--accent-soft); border-radius: 6px; border-bottom-color: transparent; }
.day .dd { font-variant-numeric: tabular-nums; line-height: 1.15; }
.day .dd b { display: block; font-weight: 600; }
.day .dd span { font-size: .74rem; color: var(--muted); text-transform: uppercase; }
.day .ic svg { width: 24px; height: 24px; display: block; }
.day .ds { color: var(--muted); font-size: .8rem; line-height: 1.25; min-width: 0; }
.day .nums { text-align: right; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.day .nums .t { font-weight: 600; }
.day .nums .r { font-size: .78rem; color: var(--rain); }
.day .nums .g { font-size: .74rem; color: var(--muted); }
.day.na .ds { font-style: italic; }
.evtag { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.others h3 { font-family: var(--f-display); font-weight: 600; font-size: .95rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 6px 0 8px; }
.cbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.cbtn { font: 600 .82rem var(--f-body); padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.cbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.src { font-size: .76rem; color: var(--muted); margin-top: 8px; }

footer { max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; font-size: .8rem; color: var(--muted); }

@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; max-height: none; }
}
@media (max-width: 900px) { .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); } .calbtns { grid-template-columns: repeat(3, minmax(0, 1fr)); } .calpair { grid-column: span 2; } }
@media (max-width: 640px) {
  .topbar-in, .layout, footer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .item, .item.ours { grid-template-columns: 52px minmax(0, 1fr); }
  .item.ours .dcol { grid-row: auto; }
  .bnr { width: 52px; }
  .acts, .item > .nowx, .strip { grid-column: 2; justify-content: flex-start; }
  .wxb { justify-self: start; }
}
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .cbtn { transition: background-color .15s, border-color .15s; } }

.pagebtn { display: inline-flex; align-items: center; gap: 8px; font: 700 .95rem var(--f-display); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; padding: 9px 16px; border-radius: 8px; background: var(--accent); color: var(--surface); border: 1px solid var(--accent); }
.pagebtn:hover { filter: brightness(1.1); }
.pagebtn.alt { background: var(--surface); color: var(--fg); border-color: var(--line); }
.wxpage { max-width: 1000px; margin: 0 auto; padding: 24px max(24px, env(safe-area-inset-left, 0px)) 56px; }
.wxpage .cbtns { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; margin: 0 0 14px; }
.wxpage .cbtn { font-size: .95rem; padding: 8px 14px; }
.wxpage .cbtn .al { color: var(--alert); font-weight: 700; }
.wxpage .cbtn[aria-pressed="true"] .al { color: inherit; }
.wxcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.wxcard .day { grid-template-columns: 70px 32px minmax(0, 1fr) auto; font-size: .95rem; padding: 8px 6px; }
.wxcard .day .ic svg { width: 30px; height: 30px; }
.wxcard .day .ds { font-size: .9rem; }
.wxcard .day.alert { background: var(--alert-soft); border-radius: 6px; }
.dayflag { display: block; font-size: .78rem; font-weight: 600; color: var(--alert); }
.leilbox { font-size: .9rem; margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
@media (max-width: 640px) { .wxpage { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brandhead"><img class="logo" src="logo-leiloinga.png" alt="Leiloingá" onerror="this.remove()"><h1>Previsão do <span>Tempo</span></h1></div>
  <div class="topr"><span class="stamp" id="stamp">Carregando…</span><a class="pagebtn alt" href="./">&larr; Agenda de leilões</a></div>
</div></div>

<div class="wxpage">
  <div class="cbtns" id="cidades" role="group" aria-label="Escolher cidade"></div>
  <div id="wx"><div class="empty">Carregando a previsão…</div></div>
  <div class="src">Fontes: Climatempo; Agrolink como segunda opinião para a chuva. Atualizado todo dia de manhã.</div>
</div>

<script>
const BASE = "Laranjeiras do Sul-PR";
const DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
const ICON = {
  play: '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11l9-5.5z"/></svg>',
  sun: '<svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="var(--sun)" stroke-width="3" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/></g><circle cx="24" cy="24" r="9" fill="var(--sun)"/></svg>',
  partly: '<svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="var(--sun)" stroke-width="2.6" stroke-linecap="round"><path d="M18 4v4M6 16h4M9.5 7.5l2.8 2.8M26.5 7.5l-2.8 2.8"/></g><circle cx="18" cy="17" r="7" fill="var(--sun)"/><path fill="var(--cloud)" d="M15 40h22a7 7 0 0 0 .9-13.9A10 10 0 0 0 19 25.5 7.3 7.3 0 0 0 15 40z"/></svg>',
  cloud: '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="var(--cloud-2)" d="M26 30h14a6 6 0 0 0 .7-12A9 9 0 0 0 24 17a6 6 0 0 0 2 13z"/><path fill="var(--cloud)" d="M11 40h22a7 7 0 0 0 .9-13.9A10 10 0 0 0 15 25.5 7.3 7.3 0 0 0 11 40z"/></svg>',
  rain: '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="var(--cloud)" d="M11 30h24a7.5 7.5 0 0 0 1-14.9A11 11 0 0 0 15.3 14 8 8 0 0 0 11 30z"/><g stroke="var(--rain)" stroke-width="3" stroke-linecap="round"><path d="M15 35l-2 6M23 35l-2 6M31 35l-2 6"/></g></svg>',
  storm: '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="var(--cloud-2)" d="M11 28h24a7.5 7.5 0 0 0 1-14.9A11 11 0 0 0 15.3 12 8 8 0 0 0 11 28z"/><path fill="var(--sun)" stroke="var(--sun)" stroke-width="1" stroke-linejoin="round" d="M25 26l-7 11h6l-2 9 9-13h-6l3-7z"/><g stroke="var(--rain)" stroke-width="3" stroke-linecap="round"><path d="M13 33l-2 5M35 33l-2 5"/></g></svg>',
  none: '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="14" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="4 5"/></svg>',
};


let D = { leiloes: [], previsao: {}, clima: {} };
let cidade = BASE;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const parseD = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
const hoje = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const ddmm = (dt) => `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}`;
function iconFor(t) {
  const s = (t || "").toLowerCase();
  if (/trovoad|temporal|severo/.test(s)) return ICON.storm;
  if (/chuv|pancad|garoa/.test(s)) return ICON.rain;
  if (/nublad|encobert|instável/.test(s)) return ICON.cloud;
  if (/nuvens/.test(s)) return ICON.partly;
  if (/sol/.test(s)) return ICON.sun;
  return ICON.cloud;
}


const nome = (c) => c.replace(/-PR$/, "");
const nossos = () => D.leiloes.filter((l) => l.leiloeira === "Leiloingá" && l.data && parseD(l.data) >= hoje());

// alerta de um dia: o do leilão da Leiloingá, ou calculado pelas mesmas regras do agenda.json
function alertaDoDia(c, x) {
  const l = nossos().find((v) => v.cidade === c && v.data === x.data);
  const p = l && D.previsao[l.id];
  if (p && p.alerta) return p.alerta;
  const r = (x.resumo || "").toLowerCase();
  const out = [];
  if ((x.chuvaMm || 0) > 30 || ((x.chuvaPct || 0) > 60 && (x.chuvaMm || 0) >= 10)) out.push("muita chuva");
  if (/trovoad|temporal|granizo/.test(r)) out.push("temporal");
  if ((x.rajada || 0) > 50) out.push("rajadas fortes");
  if (x.min != null && x.min < 5) out.push("frio");
  return out.length ? out.join(", ") : null;
}

function cidadesLista() {
  const ks = Object.keys(D.clima);
  return [BASE, ...ks.filter((k) => k !== BASE)];
}

function renderCidades() {
  $("cidades").innerHTML = cidadesLista().map((c) => {
    const dias = (D.clima[c] && D.clima[c].dias) || [];
    const temAlerta = dias.some((x) => parseD(x.data) >= hoje() && alertaDoDia(c, x));
    return `<button class="cbtn" type="button" data-c="${esc(c)}" aria-pressed="${c === cidade}">${esc(nome(c))}${temAlerta ? ' <span class="al" title="Há dias com alerta">!</span>' : ""}</button>`;
  }).join("");
}

function renderWx() {
  const dias = ((D.clima[cidade] || {}).dias || []).filter((x) => parseD(x.data) >= hoje());
  const leil = nossos().filter((l) => l.cidade === cidade);
  const dataLeil = new Set(leil.map((l) => l.data));
  let html = `<div class="wxcard"><div class="city-h"><span class="cn">${esc(nome(cidade))}</span><span class="tg">próximos ${dias.length} dias</span></div>`;
  if (leil.length) html += `<div class="leilbox">Leilão Leiloingá aqui: ${leil.map((l) => `<b>${ddmm(parseD(l.data))}</b>${l.hora ? " às " + esc(l.hora) : ""}`).join(" · ")}</div>`;
  if (!dias.length) html += `<div class="empty">Sem previsão disponível para esta cidade.</div>`;
  for (const x of dias) {
    const dt = parseD(x.data), isEv = dataLeil.has(x.data), al = alertaDoDia(cidade, x);
    const chuva = x.chuvaPct != null ? `${x.chuvaPct}%${x.chuvaMm ? " · " + x.chuvaMm + " mm" : ""}` : (x.chuvaMm ? `${x.chuvaMm} mm` : "");
    html += `<div class="day${isEv ? " ev" : ""}${al ? " alert" : ""}"><div class="dd"><b>${ddmm(dt)}</b><span>${DIAS[dt.getDay()]}</span></div>
      <div class="ic">${iconFor(x.resumo)}</div>
      <div class="ds">${isEv ? '<span class="evtag">Leilão · </span>' : ""}${esc(x.resumo || "")}${al ? `<span class="dayflag">Atenção: ${esc(al)}</span>` : ""}</div>
      <div class="nums">${x.min != null ? `<div class="t">${x.min}° / ${x.max}°</div>` : ""}${chuva ? `<div class="r">${chuva}</div>` : ""}${x.mm2 != null ? `<div class="g">Agrolink: ${x.mm2} mm</div>` : ""}${x.rajada != null ? `<div class="g">rajadas ${x.rajada} km/h</div>` : ""}${x.src && x.src !== "Climatempo" ? `<div class="g">fonte: ${esc(x.src)}</div>` : ""}</div></div>`;
  }
  $("wx").innerHTML = html + "</div>";
}

$("cidades").addEventListener("click", (e) => {
  const b = e.target.closest(".cbtn"); if (!b) return;
  cidade = b.dataset.c;
  try { localStorage.setItem("cidadeTempo", cidade); } catch (err) {}
  renderCidades(); renderWx();
});

async function carregar() {
  try {
    const r = await fetch("agenda.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    D = { leiloes: j.leiloes || [], previsao: j.previsao || {}, clima: j.clima || {} };
    try { const c = localStorage.getItem("cidadeTempo"); if (c && D.clima[c]) cidade = c; } catch (e) {}
    if (!D.clima[cidade]) cidade = cidadesLista()[0];
    if (j.atualizadoEm) {
      const t = new Date(j.atualizadoEm);
      $("stamp").textContent = "Atualizado em " + t.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }
    renderCidades(); renderWx();
  } catch (e) {
    $("stamp").textContent = "Não foi possível carregar a previsão. Recarregue a página.";
  }
}
carregar();
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); });
</script>
</body>
</html>
