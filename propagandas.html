<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E6A3E">
<title>Propagandas · Leiloingá</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Leiloingá · Propagandas dos leilões">
<meta property="og:description" content="Todas as artes de divulgação dos leilões, em um só lugar">
<meta property="og:url" content="https://leiloingaleiloes.github.io/AGENDA/propagandas.html">
<meta property="og:image" content="https://leiloingaleiloes.github.io/AGENDA/og-banner.png?v=3">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #EDEEF0;
  --surface: #FFFFFF;
  --surface-2: #F5F6F7;
  --line: #DADDE1;
  --fg: #1D2024;
  --muted: #5D636B;
  --accent: #2E6A3E;
  --accent-soft: #E1EDE3;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --on-brand: #FFFFFF;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
a { color: inherit; }
button { font: inherit; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1100px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
.brandhead { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { height: 34px; width: auto; max-width: 200px; object-fit: contain; display: block; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; margin: 0; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
h1 span { color: var(--accent); }
.homebtn { font: 600 .86rem var(--f-body); text-decoration: none; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.homebtn:hover { border-color: var(--muted); }

.wrap { max-width: 1100px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-left, 0px)) 56px; }
.intro { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.intro p { margin: 0; color: var(--muted); font-size: .92rem; }
.busca { flex: 1 1 260px; max-width: 380px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; }
.busca:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.aviso { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: .88rem; margin-bottom: 18px; }


/* ---- cidades e anos ---- */
.cidades { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; margin: 0 -2px 6px; scrollbar-width: none; }
.cidades::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 600 .92rem var(--f-body); padding: 9px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; white-space: nowrap; }
.chip b { font-weight: 600; color: var(--muted); margin-left: 3px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-brand); }
.chip[aria-pressed="true"] b { color: var(--on-brand); opacity: .8; }
.anos .chip { font-size: .82rem; padding: 6px 12px; }
.titcid { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 0 12px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.titcid h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; text-transform: uppercase; margin: 0; }
.titcid span { color: var(--muted); font-size: .85rem; }

/* ---- cartão de um leilão: Instagram + YouTube lado a lado ---- */
.leiloes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.lc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.lc-t { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.lc-t strong { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; text-transform: uppercase; line-height: 1.15; letter-spacing: .02em; }
.lc-t small { display: block; color: var(--muted); font-size: .82rem; font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-weight: 500; margin-top: 2px; }
.vem { flex: none; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.dois { display: grid; grid-template-columns: 40fr 60fr; gap: 8px; align-items: end; }
.fm { display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; color: inherit; }
.fm .rot { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.fm .rot i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.fm.ig .rot i { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
.fm.yt .rot i { background: #e62117; }
.fm img { display: block; width: 100%; border-radius: 8px; background: var(--surface-2); object-fit: cover; }
.fm.ig img { aspect-ratio: 4/5; }
.fm.yt img { aspect-ratio: 16/9; }
.fm .mais { font-size: .72rem; color: var(--muted); }
.falta { display: flex; align-items: center; justify-content: center; text-align: center; border: 1.5px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: .78rem; padding: 6px; }
.fm.ig .falta { aspect-ratio: 4/5; }
.fm.yt .falta { aspect-ratio: 16/9; }
.fm:hover img { filter: brightness(.95); }
.vazio { color: var(--muted); padding: 30px 0; text-align: center; }
.mais-btn { display: block; margin: 16px auto 0; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; cursor: pointer; }

/* ---- visualizador ---- */
.vis { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 14, .92); display: flex; flex-direction: column; color: #fff; }
.vis-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.vis-top div { flex: 1; min-width: 0; }
.vis-top strong { display: block; font-family: var(--f-display); font-size: 1.1rem; text-transform: uppercase; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vis-top small { color: #c9ced4; font-size: .82rem; }
.x { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 1.4rem; cursor: pointer; }
.abas { display: flex; gap: 6px; padding: 0 12px 8px; }
.abas button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; font-weight: 600; cursor: pointer; }
.abas button[aria-pressed="true"] { background: #fff; color: #111; }
.abas button:disabled { opacity: .35; cursor: default; }
.palco { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px; position: relative; }
.palco img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.seta { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 56px; border: 0; border-radius: 8px; background: rgba(0,0,0,.45); color: #fff; font-size: 1.5rem; cursor: pointer; }
.seta.e { left: 14px; } .seta.d { right: 14px; }
.cont { text-align: center; font-size: .8rem; color: #c9ced4; padding-top: 6px; }
.vis-acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 12px max(14px, env(safe-area-inset-bottom)); }
.vis-acts a, .vis-acts button { text-align: center; text-decoration: none; padding: 12px 6px; border-radius: 9px; border: 0; background: #fff; color: #111; font-weight: 700; font-size: .92rem; cursor: pointer; }
.vis-acts .alt { background: rgba(255,255,255,.14); color: #fff; }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brandhead"><img class="logo" src="logo-leiloinga.png" alt="Leiloingá" onerror="this.remove()"><h1>Leiloingá <span>Propagandas</span></h1></div>
  <a class="homebtn" href="./">← Painel</a>
</div></div>

<div class="wrap">
  <div class="intro">
    <p id="resumo">Carregando…</p>
    <input class="busca" id="busca" type="search" placeholder="Buscar leilão ou data (ex.: águas, dezembro 2024)" aria-label="Buscar">
  </div>
  <div class="cidades" id="cidades" role="group" aria-label="Cidade"></div>
  <div class="cidades anos" id="anos" role="group" aria-label="Ano"></div>
  <div class="cidades anos" id="fmts" role="group" aria-label="Formato"></div>
  <div id="lista"></div>
</div>
<div id="vis"></div>

<script>
(function () {
  var MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var MESL = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
  var REPET = { "É amanhã": 1, "É hoje": 1, "Contagem": 1 };   /* posts repetitivos: só aparecem se o leilão não tiver outro */
  var LEI = [], porCid = {}, cidade = "", ano = "", fmt = "", lim = 24, VIS = null;
  function tipo(l) { return l.mostrar.length && l.yt.length ? "ambos" : l.mostrar.length ? "ig" : "yt"; }

  function d(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dias(a, b) { return Math.abs(d(a) - d(b)) / 864e5; }
  function curta(iso) { var x = d(iso); return String(x.getDate()).padStart(2, "0") + "/" + String(x.getMonth() + 1).padStart(2, "0") + "/" + x.getFullYear(); }
  function longa(iso) { var x = d(iso); return SEM[x.getDay()] + ", " + x.getDate() + " " + MES[x.getMonth()] + " " + x.getFullYear(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function sem(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function nomeBom(s) { s = String(s || "").trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : "Leilão"; }

  /* um leilão = mesma cidade, datas a até 4 dias; junta posts do Instagram, banner do site e capa do YouTube */
  function montar(posts, videos) {
    var out = [];
    posts.slice().sort(function (a, b) { return a.data_leilao.localeCompare(b.data_leilao); }).forEach(function (p) {
      if (!p.cidade || p.cidade === "Sem cidade identificada") return;
      var l = null;
      for (var i = out.length - 1; i >= 0; i--) { var x = out[i]; if (x.cidade === p.cidade && dias(x.data, p.data_leilao) <= 4) { l = x; break; } if (dias(x.data, p.data_leilao) > 40) break; }
      if (!l) { l = { cidade: p.cidade, data: p.data_leilao, nomes: [], artes: [], yt: [] }; out.push(l); }
      if (!REPET[p.chamada] && p.data_leilao > l.data) l.data = p.data_leilao;
      if (REPET[p.chamada] && !l.artes.some(function (a) { return !REPET[a.chamada]; }) && p.data_leilao > l.data) l.data = p.data_leilao;
      l.artes.push(p); if (p.leilao) l.nomes.push(p.leilao);
    });
    videos.forEach(function (v) {
      if (!v.cidade) return;
      var best = null, bd = 99;
      out.forEach(function (x) { if (x.cidade !== v.cidade) return; var df = dias(x.data, v.data); if (df <= 4 && df < bd) { bd = df; best = x; } });
      if (!best) { best = { cidade: v.cidade, data: v.data, incerta: !!v.data_incerta, nomes: [], artes: [], yt: [] }; out.push(best); }
      best.yt.push(v);
    });
    out.forEach(function (l) {
      var principais = l.artes.filter(function (a) { return !REPET[a.chamada]; });
      l.mostrar = (principais.length ? principais : l.artes).sort(function (a, b) {
        var pa = a.fonte === "site" ? 1 : 0, pb = b.fonte === "site" ? 1 : 0; return pa - pb || (a.publicado || "").localeCompare(b.publicado || ""); });
      l.yt.sort(function (a, b) { return (a.canal ? 1 : 0) - (b.canal ? 1 : 0); });
      var ytBom = l.yt.filter(function (v) { return !v.canal; })[0], ig0 = principais[0] || l.artes[0];
      l.nome = nomeBom(ytBom ? ytBom.titulo : ig0 ? ig0.leilao : "Leilão em " + l.cidade);
      l.busca = sem([l.nome, l.cidade, MESL[d(l.data).getMonth()], d(l.data).getFullYear(), curta(l.data)].concat(l.nomes).join(" "));
    });
    return out.sort(function (a, b) { return b.data.localeCompare(a.data); });
  }

  function cartao(l, k) {
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var ig = l.mostrar[0], yt = l.yt[0];
    var igH = ig ? '<img src="' + esc(ig.imagem) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=falta>Imagem indisponível</div>\'">' : '<div class="falta">Sem post no Instagram</div>';
    var ytH = yt && yt.imagem ? '<img src="' + esc(yt.imagem) + '" alt="" loading="lazy">' : '<div class="falta">' + (yt ? "Capa indisponível" : "Sem capa no YouTube") + '</div>';
    return '<article class="lc"><div class="lc-t"><strong>' + esc(l.nome) + '<small>' + (l.incerta ? "por volta de " + curta(l.data) : longa(l.data)) + '</small></strong>' +
      (d(l.data) >= hoje ? '<span class="vem">Vem aí</span>' : '') + '</div>' +
      '<div class="dois"><button class="fm ig" type="button" data-k="' + k + '" data-f="ig"' + (ig ? '' : ' disabled') + '><span class="rot"><i></i>Instagram</span>' + igH +
      (l.mostrar.length > 1 ? '<span class="mais">+' + (l.mostrar.length - 1) + (l.mostrar.length === 2 ? ' arte' : ' artes') + '</span>' : '') + '</button>' +
      '<button class="fm yt" type="button" data-k="' + k + '" data-f="yt"' + (yt ? '' : ' disabled') + '><span class="rot"><i></i>YouTube</span>' + ytH + '</button></div></article>';
  }

  var VISTA = [];
  function render() {
    var f = sem(document.getElementById("busca").value.trim());
    VISTA = LEI.filter(function (l) { return (!cidade || l.cidade === cidade) && (!ano || l.data.slice(0, 4) === ano) && (!fmt || tipo(l) === fmt) && (!f || f.split(/\s+/).every(function (w) { return l.busca.indexOf(w) >= 0; })); });
    var ambos = VISTA.filter(function (l) { return l.mostrar.length && l.yt.length; }).length;
    var h = '<div class="titcid"><h2>' + esc(cidade || "Todas as cidades") + (ano ? " · " + ano : "") + '</h2><span>' + VISTA.length + (VISTA.length === 1 ? " leilão" : " leilões") + ' · ' + ambos + ' com os dois formatos</span></div>';
    h += VISTA.length ? '<div class="leiloes">' + VISTA.slice(0, lim).map(cartao).join("") + '</div>' : '<p class="vazio">Nenhum leilão encontrado.</p>';
    if (VISTA.length > lim) h += '<button class="mais-btn" id="maisBtn" type="button">Mostrar mais (' + (VISTA.length - lim) + ')</button>';
    document.getElementById("lista").innerHTML = h;
    var mb = document.getElementById("maisBtn"); if (mb) mb.onclick = function () { lim += 24; render(); };
  }

  function chipsCidade() {
    var cs = Object.keys(porCid).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });
    var el = document.getElementById("cidades");
    el.innerHTML = cs.map(function (c) { return '<button type="button" class="chip" data-c="' + esc(c) + '" aria-pressed="' + (c === cidade) + '">' + esc(c) + ' <b>' + porCid[c] + '</b></button>'; }).join("") +
      '<button type="button" class="chip" data-c="" aria-pressed="' + (!cidade) + '">Todas <b>' + LEI.length + '</b></button>';
    el.onclick = function (e) { var b = e.target.closest(".chip"); if (!b) return; cidade = b.getAttribute("data-c"); ano = ""; lim = 24; chipsCidade(); chipsAno(); chipsFmt(); render(); };
  }
  function chipsAno() {
    var cont = {}; LEI.forEach(function (l) { if (!cidade || l.cidade === cidade) { var a = l.data.slice(0, 4); cont[a] = (cont[a] || 0) + 1; } });
    var as = Object.keys(cont).sort().reverse(), el = document.getElementById("anos");
    el.innerHTML = '<button type="button" class="chip" data-a="" aria-pressed="' + (!ano) + '">Todos os anos</button>' +
      as.map(function (a) { return '<button type="button" class="chip" data-a="' + a + '" aria-pressed="' + (a === ano) + '">' + a + ' <b>' + cont[a] + '</b></button>'; }).join("");
    el.onclick = function (e) { var b = e.target.closest(".chip"); if (!b) return; ano = b.getAttribute("data-a"); lim = 24; chipsAno(); chipsFmt(); render(); };
  }

  function chipsFmt() {
    var cont = { "": 0, ig: 0, yt: 0, ambos: 0 };
    LEI.forEach(function (l) { if ((!cidade || l.cidade === cidade) && (!ano || l.data.slice(0, 4) === ano)) { cont[""]++; cont[tipo(l)]++; } });
    var op = [["", "Todos os formatos"], ["ambos", "Instagram + YouTube"], ["ig", "Só Instagram"], ["yt", "Só YouTube"]], el = document.getElementById("fmts");
    el.innerHTML = op.map(function (o) { return '<button type="button" class="chip" data-m="' + o[0] + '" aria-pressed="' + (o[0] === fmt) + '">' + o[1] + ' <b>' + cont[o[0]] + '</b></button>'; }).join("");
    el.onclick = function (e) { var b = e.target.closest(".chip"); if (!b) return; fmt = b.getAttribute("data-m"); lim = 24; chipsFmt(); render(); };
  }

  /* ---- visualizador: abre a arte grande, troca Instagram/YouTube, baixa ---- */
  function abrir(k, f) { VIS = { l: VISTA[k], f: f, i: 0 }; desenha(); document.body.style.overflow = "hidden"; }
  function fechar() { VIS = null; document.getElementById("vis").innerHTML = ""; document.body.style.overflow = ""; }
  function desenha() {
    var l = VIS.l, lista = VIS.f === "ig" ? l.mostrar : l.yt, it = lista[VIS.i] || {}, img = it.imagem || "";
    var arq = l.cidade + " - " + l.nome + " - " + curta(l.data).replace(/\//g, "-") + (VIS.f === "ig" ? (lista.length > 1 ? " (" + (VIS.i + 1) + ")" : "") + " - instagram" : " - youtube") + ".jpg";
    var acts = VIS.f === "ig"
      ? '<a href="' + esc(img) + '" download="' + esc(arq) + '">Baixar</a><a class="alt" href="' + esc(img) + '" target="_blank" rel="noopener">Abrir</a>' + (it.legenda ? '<button class="alt" type="button" id="vLeg">Copiar legenda</button>' : '<button class="alt" type="button" id="vLink">Copiar link</button>')
      : '<a href="' + esc(img) + '" download="' + esc(arq) + '">Baixar</a><a class="alt" href="' + esc(img) + '" target="_blank" rel="noopener">Abrir</a><a class="alt" href="https://www.youtube.com/watch?v=' + esc(it.id) + '" target="_blank" rel="noopener">Assistir</a>';
    document.getElementById("vis").innerHTML = '<div class="vis" role="dialog" aria-modal="true"><div class="vis-top"><div><strong>' + esc(l.nome) + '</strong><small>' + esc(l.cidade) + ' · ' + (l.incerta ? "por volta de " + curta(l.data) : longa(l.data)) + '</small></div><button class="x" type="button" id="vX" aria-label="Fechar">×</button></div>' +
      '<div class="abas"><button type="button" data-f="ig" aria-pressed="' + (VIS.f === "ig") + '"' + (l.mostrar.length ? '' : ' disabled') + '>Instagram' + (l.mostrar.length > 1 ? ' (' + l.mostrar.length + ')' : '') + '</button><button type="button" data-f="yt" aria-pressed="' + (VIS.f === "yt") + '"' + (l.yt.length ? '' : ' disabled') + '>YouTube</button></div>' +
      '<div class="palco">' + (img ? '<img src="' + esc(img) + '" alt="">' : '<div class="falta" style="color:#ccc;padding:30px">Imagem indisponível</div>') +
      (lista.length > 1 ? '<button class="seta e" type="button" id="vE" aria-label="Anterior">‹</button><button class="seta d" type="button" id="vD" aria-label="Próxima">›</button>' : '') + '</div>' +
      (lista.length > 1 ? '<div class="cont">' + (VIS.i + 1) + ' de ' + lista.length + (it.chamada ? ' · ' + esc(it.chamada) : '') + '</div>' : '') +
      '<div class="vis-acts">' + acts + '</div></div>';
    var V = document.getElementById("vis");
    V.querySelector("#vX").onclick = fechar;
    V.querySelector(".vis").onclick = function (e) { if (e.target.classList.contains("palco")) fechar(); };
    V.querySelectorAll(".abas button").forEach(function (b) { b.onclick = function () { VIS.f = b.getAttribute("data-f"); VIS.i = 0; desenha(); }; });
    var e = V.querySelector("#vE"), dd = V.querySelector("#vD");
    if (e) e.onclick = function () { VIS.i = (VIS.i - 1 + lista.length) % lista.length; desenha(); };
    if (dd) dd.onclick = function () { VIS.i = (VIS.i + 1) % lista.length; desenha(); };
    var lg = V.querySelector("#vLeg"); if (lg) lg.onclick = function () { copiar(it.legenda, lg, "Legenda copiada!"); };
    var lk = V.querySelector("#vLink"); if (lk) lk.onclick = function () { copiar(new URL(img, location.href).href, lk, "Link copiado!"); };
  }
  function copiar(t, b, ok) { var v = b.textContent; var fim = function () { b.textContent = ok; setTimeout(function () { b.textContent = v; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(fim, function () { prompt("Copie:", t); }); else prompt("Copie:", t); }
  document.addEventListener("keydown", function (e) { if (!VIS) return; if (e.key === "Escape") fechar(); if (e.key === "ArrowRight") { var b = document.getElementById("vD"); if (b) b.click(); } if (e.key === "ArrowLeft") { var a = document.getElementById("vE"); if (a) a.click(); } });
  document.getElementById("lista").addEventListener("click", function (e) { var b = e.target.closest(".fm"); if (b && !b.disabled) abrir(+b.getAttribute("data-k"), b.getAttribute("data-f")); });
  var tm; document.getElementById("busca").addEventListener("input", function () { clearTimeout(tm); tm = setTimeout(function () { lim = 24; render(); }, 200); });

  fetch("propagandas.json?v=" + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
    LEI = montar(j.posts || [], j.videos || []);
    LEI.forEach(function (l) { porCid[l.cidade] = (porCid[l.cidade] || 0) + 1; });
    var ambos = LEI.filter(function (l) { return l.mostrar.length && l.yt.length; }).length;
    document.getElementById("resumo").textContent = LEI.length + " leilões em " + Object.keys(porCid).length + " cidades · " + ambos + " com post do Instagram e capa do YouTube · toque numa imagem para abrir";
    cidade = LEI[0] ? LEI[0].cidade : "";   /* começa pela cidade do leilão mais recente */
    chipsCidade(); chipsAno(); chipsFmt(); render();
  }).catch(function () { document.getElementById("resumo").textContent = "Não foi possível carregar a lista."; });
})();
