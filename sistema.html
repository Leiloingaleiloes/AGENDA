<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F4D2C">
<title>Leiloingá · Sistema</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Sistema Leiloingá: uma tela só. Menu lateral fixo, barra superior com o nome da área,
   e cada página do painel abre dentro da área principal (sem trocar de aba).
   As páginas abertas ficam vivas: ao voltar para uma delas, o que estava preenchido continua lá. */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --line:#E1E4DF; --line-2:#CDD2CB;
  --fg:#1A1F1B; --muted:#5E665F; --faint:#8A928B;
  --green:#2E6A3E; --green-d:#1F4D2C; --green-soft:#E3EEE5; --green-ink:#1D5130;
  --orange:#E8780F; --orange-soft:#FDEBD8;
  --alert:#B42318; --alert-soft:#FDE7E4; --rain:#2F6FB0; --rain-soft:#E3EDF8;
  --c-leiloinga:#2E6A3E; --c-gralha:#123E7A; --c-panorama:#0A8299; --c-pampa:#5B6E62;
  --side:248px; --top:60px;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,30,22,.06),0 4px 16px rgba(20,30,22,.05);
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100dvh;transition:grid-template-columns .2s ease}
.app.mini{--side:72px}

/* ---------- menu lateral ---------- */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.brand{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.brand img{height:30px;width:auto;max-width:150px;object-fit:contain}
.brand .mark{display:none;width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;font:700 20px var(--f-display);place-items:center}
.app.mini .brand img{display:none}.app.mini .brand .mark{display:grid}
.app.mini .brand{justify-content:center;padding:0}
.nav{flex:1;overflow-y:auto;padding:12px 10px 16px}
.grp{font-size:12px;font-weight:600;color:var(--faint);padding:14px 10px 6px}
.app.mini .grp{font-size:0;padding:10px 0 4px;border-top:1px solid var(--line);margin:6px 8px 0}
.app.mini .grp:first-child{border:0}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:8px 10px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left;font-weight:500;color:var(--fg);text-decoration:none;position:relative}
.item svg{width:20px;height:20px;flex:none;color:var(--muted)}
.item:hover{background:var(--surface-2)}
.item.on{background:var(--green-soft);color:var(--green-ink);font-weight:700}
.item.on svg{color:var(--green)}
.item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--orange-soft);color:#9A4A00}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;opacity:0}
.item.vivo .dot{opacity:.55}
.app.mini .item{justify-content:center;padding:8px 0}
.app.mini .item .lbl,.app.mini .item .tag{display:none}
.app.mini .item .dot{position:absolute;top:8px;right:12px}
.app.mini .item:hover::after{content:attr(data-nome);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--fg);color:#fff;font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px;white-space:nowrap;z-index:20;pointer-events:none}
.sidefoot{border-top:1px solid var(--line);padding:10px;flex:none}
.subs{display:grid;gap:1px;margin:2px 0 6px 21px;padding-left:12px;border-left:2px solid var(--line)}
.sub{display:flex;align-items:center;min-height:36px;padding:6px 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;font-size:14px;font-weight:500;color:var(--muted)}
.sub:hover{background:var(--surface-2);color:var(--fg)}
.sub.on{color:var(--green-ink);font-weight:700;background:var(--green-soft)}
.app.mini .subs{display:none}
.sidefoot .item{color:var(--muted)}

/* ---------- área principal ---------- */
.main{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{height:var(--top);flex:none;display:flex;align-items:center;gap:12px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 20px;background:var(--surface);border-bottom:1px solid var(--line);margin-top:env(safe-area-inset-top,0px)}
.btn.burger{display:none}
.ttl{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
.ttl b{font:700 22px var(--f-display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d)}
.btn.ico{padding:0;width:38px;justify-content:center}
.stamp{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600;pointer-events:none;background:var(--bg)}
.loading.off{display:none}

/* ---------- início ---------- */
#v-inicio{overflow-y:auto}
.home{max-width:1280px;margin:0 auto;padding:24px 24px 48px;display:grid;gap:18px}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
.hello h1{margin:0;font:700 34px/1.05 var(--f-display)}
.hello p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:2px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--line-2)}
.kpi small{font-size:13px;color:var(--muted);font-weight:600}
.kpi strong{font:700 34px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn strong{color:var(--alert)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font:700 19px var(--f-display);letter-spacing:.01em}
.link{border:0;background:none;color:var(--green);font-weight:700;font-size:14px;cursor:pointer;padding:6px 0}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.hero .pic{background:var(--green-d) center/cover no-repeat;min-height:230px;position:relative}
.hero .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
.hero .pic .cd{position:absolute;left:14px;bottom:12px;z-index:1;color:#fff;font:700 15px var(--f-body);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:99px}
.hero .info{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.eyeb{font-size:13px;font-weight:700;color:var(--orange)}
.hero h3{margin:0;font:700 28px/1.05 var(--f-display);text-wrap:balance}
.meta{display:grid;gap:4px;color:var(--muted);font-size:14.5px}
.meta b{color:var(--fg);font-weight:600}
.wx{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--rain-soft);font-size:14px}
.wx.bad{background:var(--alert-soft)}
.wx svg{width:22px;height:22px;flex:none;color:var(--rain)}
.wx.bad svg{color:var(--alert)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px}
.qa{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;min-height:64px}
.qa:hover{border-color:var(--green);background:var(--green-soft)}
.qa .ic{width:38px;height:38px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.qa .ic svg{width:20px;height:20px}
.qa b{display:block;font-size:14.5px}
.qa span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.list{display:grid}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{text-align:center;line-height:1.05}
.date b{display:block;font:700 24px var(--f-display);font-variant-numeric:tabular-nums}
.date span{font-size:12px;color:var(--muted);font-weight:600;text-transform:lowercase}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;color:#fff;padding:1px 8px;border-radius:99px;white-space:nowrap}
.row .yt{font-size:13px;font-weight:700;color:var(--alert);text-decoration:none;white-space:nowrap}
.row .hr{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer;min-height:32px}
.fbtn.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:16px 14px 14px}
.day{display:grid;justify-items:center;gap:4px;text-align:center;font-size:12.5px}
.day .w{font-weight:700;color:var(--muted)}
.day .bar{width:100%;max-width:34px;height:74px;background:var(--surface-2);border-radius:7px;position:relative;overflow:hidden}
.day .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--rain);border-radius:7px 7px 0 0;opacity:.85}
.day .bar i.hi{background:var(--alert)}
.day .mm{font-weight:700;font-variant-numeric:tabular-nums}
.day .tp{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cityp{padding:0 18px 14px;display:flex;gap:6px;flex-wrap:wrap}
.alerts{display:grid}
.al{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line);font-size:14px}
.al:first-child{border-top:0}
.al b{display:block}
.al svg{width:20px;height:20px;flex:none;color:var(--alert);margin-top:2px}
.empty{padding:16px 18px;color:var(--muted);font-size:14px}
.obs{font-size:13px;color:var(--muted);padding:0 2px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.scrim{display:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app,.app.mini{grid-template-columns:minmax(0,1fr);--side:270px}
  .side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:40;transform:translateX(-100%);transition:transform .2s ease}
  .app.open .side{box-shadow:0 0 40px rgba(0,0,0,.2)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  .app.mini .brand img{display:block}.app.mini .brand .mark{display:none}
  .app.mini .item .lbl,.app.mini .item .tag{display:inline}
  .app.mini .item{justify-content:flex-start;padding:8px 10px}
  .app.mini .grp{font-size:12px;padding:14px 10px 6px;border:0;margin:0}
  #mini{display:none}
  .btn.burger{display:inline-flex}
  .top{padding-left:12px}
  .stamp,.btn .t{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .home{padding:16px 14px 40px}
}
@media (max-width:520px){.kpis{gap:10px}.kpi strong{font-size:28px}.quick{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:52px minmax(0,1fr)}.row .end{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Menu">
    <div class="brand"><img src="logo-leiloinga.png" alt="Leiloingá"><span class="mark" aria-hidden="true">L</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <button class="item" id="mini" type="button" data-nome="Recolher menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="15" height="14" rx="2.5"/><path d="M7.5 3v14M12.5 8l-2 2 2 2"/></svg><span class="lbl">Recolher menu</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="btn ico burger" id="burger" type="button" aria-label="Abrir menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg></button>
      <div class="ttl"><b id="t-nome">Início</b><span id="t-desc">Resumo do dia</span></div>
      <div class="tools">
        <span class="stamp" id="stamp"></span>
        <button class="btn ico" id="reload" type="button" title="Recarregar esta área" aria-label="Recarregar esta área"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2"/></svg></button>
        <a class="btn" id="newtab" href="#" target="_blank" rel="noopener" title="Abrir esta área numa aba separada"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5h5.5V9M16.5 3.5 9.5 10.5M14 12v3.5a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1H8"/></svg><span class="t">Nova aba</span></a>
      </div>
    </header>

    <div class="stage" id="stage">
      <section class="view on" id="v-inicio">
        <div class="home">
          <div class="hello">
            <div><h1 id="hi">Bom dia</h1><p id="today"></p></div>
            <p class="obs" id="obs"></p>
          </div>

          <div class="kpis" id="kpis"></div>

          <div class="grid2">
            <div class="card" id="prox"></div>
            <div class="card">
              <div class="card-h"><h2>Atalhos</h2></div>
              <div class="quick" id="quick"></div>
            </div>
          </div>

          <div class="grid2">
            <div class="card">
              <div class="card-h"><h2>Próximos leilões</h2><div class="filters" id="filt"></div></div>
              <div class="list" id="lista"></div>
              <div class="card-h" style="border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end"><button class="link" data-go="agenda" type="button">Ver agenda completa →</button></div>
            </div>
            <div style="display:grid;gap:18px">
              <div class="card">
                <div class="card-h"><h2>Tempo</h2><button class="link" data-go="tempo" type="button">Mapa e 10 dias →</button></div>
                <div class="cityp" id="cities" style="padding-top:12px"></div>
                <div class="days" id="days" style="padding-top:4px"></div>
              </div>
              <div class="card">
                <div class="card-h"><h2>Alertas nos leilões da Leiloingá</h2></div>
                <div class="alerts" id="alerts"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
/* ---------- áreas do sistema ---------- */
const I = {
  inicio:'<path d="M3 9.5 10 3.5l7 6V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z"/>',
  agenda:'<rect x="2.5" y="4" width="15" height="13" rx="2"/><path d="M2.5 8h15M6.5 2.5v3M13.5 2.5v3"/>',
  tempo:'<circle cx="7.5" cy="7.5" r="3"/><path d="M6 17h8.5a3.5 3.5 0 0 0 .3-7 4.8 4.8 0 0 0-8.9 1.2A2.9 2.9 0 0 0 6 17z"/>',
  fichas:'<path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5M7.5 10h5.5M7.5 13h5.5"/>',
  v2:'<rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M2.5 7.5h15M7 7.5V17"/>',
  boleta:'<rect x="3.5" y="2.5" width="13" height="15" rx="2"/><path d="m6.5 7 1.4 1.4L10.5 6M6.5 12.5l1.4 1.4 2.6-2.6M12.5 7.5H14M12.5 13H14"/>',
  relatorio:'<path d="M3 17h14"/><rect x="4" y="10" width="3" height="5" rx=".7"/><rect x="8.5" y="5" width="3" height="10" rx=".7"/><rect x="13" y="8" width="3" height="7" rx=".7"/>',
  lotes:'<path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3.5" cy="5" r="1"/><circle cx="3.5" cy="10" r="1"/><circle cx="3.5" cy="15" r="1"/>',
  propagandas:'<path d="M3 8v4h3l6.5 4V4L6 8z"/><path d="M15 7a4 4 0 0 1 0 6"/>',
  site:'<circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.2 2.2 3 4.7 3 7.5s-.8 5.3-3 7.5c-2.2-2.2-3-4.7-3-7.5s.8-5.3 3-7.5z"/>',
  copy:'<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V4.5a1.5 1.5 0 0 0-1.5-1.5h-7A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13H7"/>',
  zap:'<path d="M4 16.5 5 13a7 7 0 1 1 2.6 2.6z"/><path d="M8 8.2c.2 1.6 1.9 3.5 3.8 3.8l.9-1 1.4.7c-.2 1-.9 1.6-1.9 1.6-2.7 0-5.5-2.8-5.5-5.5 0-1 .6-1.7 1.6-1.9l.7 1.4z"/>',
  alerta:'<path d="M10 3 2.5 16.5h15z"/><path d="M10 8v4M10 14.2v.1"/>',
  chuva:'<path d="M6 13h8.5a3.5 3.5 0 0 0 .3-7 4.8 4.8 0 0 0-8.9 1.2A2.9 2.9 0 0 0 6 13zM7 15.5l-.8 1.5M10.5 15.5l-.8 1.5M14 15.5l-.8 1.5"/>'
};
const svg = k => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

const AREAS = [
  {grp:'Geral'},
  {id:'inicio', nome:'Início', desc:'Resumo do dia', ic:'inicio'},
  {id:'agenda', nome:'Agenda de leilões', desc:'Leiloingá, Gralha Azul, Panorama e Pampa Remates', ic:'agenda', url:'agenda.html'},
  {id:'tempo', nome:'Previsão do tempo', desc:'Mapa e 10 dias nas cidades dos leilões', ic:'tempo', url:'tempo.html'},
  {grp:'Dia de leilão'},
  {id:'fichas', nome:'Lotes · ADM', desc:'Fichas em Word, câmera dos lotes e envio para o site', ic:'fichas', url:'fichas.html'},
  {id:'boleta', nome:'Conferência Boleta', desc:'Vendido ou retorno, lance e corretor de cada lote', ic:'boleta', url:'boleta.html?embed=1', aberta:'boleta.html',
   sub:[{h:'pista',nome:'Pista',desc:'Lote a lote: lance, vendido ou retorno, corretor'},
        {h:'V',nome:'Vendidos',desc:'Lotes vendidos e faturamento'},
        {h:'R',nome:'Retorno',desc:'Lotes que voltaram'},
        {h:'rel',nome:'Pós-leilão',desc:'Todos os lotes em linhas, doação e comissão'},
        {h:'com',nome:'Comissão',desc:'Comissão da praça, Rural, leiloeiro e divisão'}]},
  {id:'relatorio', nome:'Relatório por categoria', desc:'Peso, raça, idade e sexo: médias de R$/kg para mandar ao chefe', ic:'relatorio', url:'relatorio.html'},
  {id:'v2', nome:'Lotes ADM v2', desc:'Layout novo em teste, com dados de teste separados', ic:'v2', url:'lotes-v2/', tag:'teste'},
  {grp:'Divulgação'},
  {id:'lotes', nome:'Catálogo dos lotes', desc:'O que o produtor vê no link do QR code', ic:'lotes', url:'../LOTES/'},
  {id:'propagandas', nome:'Propagandas', desc:'Artes de divulgação dos leilões', ic:'propagandas', url:'propagandas.html'},
  {id:'site', nome:'Site novo', desc:'Versão completa do site da Leiloingá, em teste', ic:'site', url:'site/', tag:'teste'}
];
const BY = Object.fromEntries(AREAS.filter(a=>a.id).map(a=>[a.id,a]));
const CATALOGO = 'https://leiloingaleiloes.github.io/LOTES/';

const app = document.getElementById('app'), nav = document.getElementById('nav'), stage = document.getElementById('stage');
nav.innerHTML = AREAS.map(a => a.grp ? `<div class="grp">${a.grp}</div>` :
  `<button class="item" type="button" data-id="${a.id}" data-nome="${a.nome}">${svg(a.ic)}<span class="lbl">${a.nome}</span>${a.tag?`<span class="tag">${a.tag}</span>`:''}<span class="dot" aria-hidden="true"></span></button>` +
  (a.sub ? `<div class="subs">${a.sub.map(x => `<button class="sub" type="button" data-id="${a.id}" data-sub="${x.h}">${x.nome}</button>`).join('')}</div>` : '')).join('');

/* ---------- troca de área sem sair da tela ---------- */
const frames = {};
let atual = null;

function ajustarPagina(id, fr){
  /* As páginas são do mesmo site: tira o botão "Início/Painel" de cada uma
     (o menu lateral faz esse papel) e faz os links internos abrirem aqui dentro. */
  let d; try { d = fr.contentDocument; } catch(e){ return; }
  if (!d || !d.head) return;
  const st = d.createElement('style');
  st.textContent = 'a[href="./"],a[href="index.html"],a[href="../"]{display:none!important}'
    + (['site','lotes'].includes(id) ? '' : 'img[src*="logo-leiloinga"]{display:none!important}');
  d.head.appendChild(st);
  d.addEventListener('click', ev => {
    const a = ev.target.closest && ev.target.closest('a[href]');
    if (!a || a.target === '_blank') return;
    let u; try { u = new URL(a.getAttribute('href'), d.location.href); } catch(e){ return; }
    if (u.origin !== location.origin) return;
    const destino = AREAS.find(x => x.url && new URL(x.url, location.href).pathname === u.pathname);
    const inicio = /\/AGENDA\/(index\.html)?$/.test(u.pathname) || u.pathname.endsWith('/sistema.html');
    if (destino && destino.id !== id){ ev.preventDefault(); ir(destino.id); }
    else if (inicio){ ev.preventDefault(); ir('inicio'); }
  }, true);
}

function abrirFrame(id, sub){
  const a = BY[id];
  const v = document.createElement('section');
  v.className = 'view'; v.id = 'v-' + id;
  v.innerHTML = `<div class="loading">Carregando ${a.nome}…</div>`;
  const fr = document.createElement('iframe');
  fr.title = a.nome; fr.src = a.url + (sub ? '#' + sub : '');
  fr.setAttribute('allow', 'camera; microphone; clipboard-write; fullscreen');
  fr.addEventListener('load', () => { v.querySelector('.loading').classList.add('off'); ajustarPagina(id, fr); });
  v.prepend(fr); stage.appendChild(v);
  frames[id] = fr;
  nav.querySelector(`[data-id="${id}"]`).classList.add('vivo');
  return v;
}

let subAtual = {};
function ir(id, semHash){
  let sub = null;
  if (!BY[id] && id && id.indexOf('-') > 0){ const p = id.split('-'); id = p[0]; sub = p[1]; }
  if (!BY[id]) id = 'inicio';
  const a = BY[id];
  if (a.sub){ sub = (a.sub.find(x => x.h === sub) || a.sub.find(x => x.h === subAtual[id]) || a.sub[0]).h; subAtual[id] = sub; }
  if (id !== 'inicio' && !frames[id]) abrirFrame(id, sub);
  else if (sub && frames[id]) { try { if (frames[id].contentWindow.location.hash !== '#' + sub) frames[id].contentWindow.location.hash = sub; } catch(e){} }
  stage.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + id));
  nav.querySelectorAll('.item[data-id]').forEach(b => { const on = b.dataset.id === id; b.classList.toggle('on', on); on ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'); });
  nav.querySelectorAll('.sub').forEach(b => b.classList.toggle('on', b.dataset.id === id && b.dataset.sub === sub));
  const sa = sub && a.sub ? a.sub.find(x => x.h === sub) : null;
  document.getElementById('t-nome').textContent = sa ? sa.nome : a.nome;
  document.getElementById('t-desc').textContent = sa ? a.nome + ' · ' + sa.desc : a.desc;
  const nt = document.getElementById('newtab');
  nt.href = a.url ? new URL((a.aberta || a.url) + (sub ? '#' + sub : ''), location.href).href : location.href.split('#')[0];
  nt.style.display = a.url ? '' : 'none';
  document.title = (id === 'inicio' ? 'Leiloingá · Sistema' : (sa ? sa.nome : a.nome) + ' · Leiloingá');
  atual = id;
  app.classList.remove('open');
  const hh = sub ? id + '-' + sub : id;
  if (!semHash && location.hash !== '#' + hh) history.replaceState(null, '', '#' + hh);
  try { localStorage.setItem('sistema-ultima', id); } catch(e){}
}

nav.addEventListener('click', e => { const s2 = e.target.closest('.sub'); if (s2) return ir(s2.dataset.id + '-' + s2.dataset.sub); const b = e.target.closest('.item[data-id]'); if (b) ir(b.dataset.id); });
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) ir(g.dataset.go); });
window.addEventListener('hashchange', () => ir(location.hash.slice(1), true));
window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || !e.data.boletaTab) return; if (atual === 'boleta' && subAtual.boleta !== e.data.boletaTab) ir('boleta-' + e.data.boletaTab); });
document.getElementById('reload').addEventListener('click', () => {
  if (atual === 'inicio') return carregar();
  const fr = frames[atual]; if (!fr) return;
  fr.parentElement.querySelector('.loading').classList.remove('off');
  try { fr.contentWindow.location.reload(); } catch(e){ fr.src = fr.src; }
});
document.getElementById('burger').addEventListener('click', () => app.classList.add('open'));
document.getElementById('scrim').addEventListener('click', () => app.classList.remove('open'));
document.getElementById('mini').addEventListener('click', () => {
  app.classList.toggle('mini');
  try { localStorage.setItem('sistema-mini', app.classList.contains('mini') ? '1' : ''); } catch(e){}
});
try { if (localStorage.getItem('sistema-mini')) app.classList.add('mini'); } catch(e){}

/* ---------- utilidades ---------- */
const toast = t => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2200); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dt = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const hojeISO = () => { const n = new Date(); return new Date(n.getTime() - n.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const diasAte = s => Math.round((dt(s) - dt(hojeISO())) / 864e5);
const quando = s => { const n = diasAte(s); return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : `em ${n} dias`; };
const COR = {'Leiloingá':'var(--c-leiloinga)','Gralha Azul':'var(--c-gralha)','Panorama':'var(--c-panorama)','Pampa Remates':'var(--c-pampa)'};
function copiar(txt, msg){
  const ok = () => toast(msg || 'Link copiado');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => window.prompt('Copie:', txt));
  else window.prompt('Copie:', txt);
}

/* ---------- início ---------- */
let DADOS = null, filtro = 'Todas', cidade = 'Laranjeiras do Sul-PR';

function saudacao(){
  const h = new Date().getHours();
  document.getElementById('hi').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const n = new Date();
  document.getElementById('today').textContent = n.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}).replace(/^./, c => c.toUpperCase());
}

function render(){
  const d = DADOS, hoje = hojeISO();
  const fut = d.leiloes.filter(l => l.data >= hoje).sort((a,b) => (a.data+a.hora).localeCompare(b.data+b.hora));
  const nossos = fut.filter(l => l.leiloeira === 'Leiloingá');
  const prox = nossos[0];
  const sem7 = fut.filter(l => diasAte(l.data) <= 7);
  const alertas = Object.entries(d.previsao || {}).filter(([k,p]) => p.alerta && p.data >= hoje).sort((a,b) => a[1].data.localeCompare(b[1].data));
  const at = d.atualizadoEm ? new Date(d.atualizadoEm) : null;

  document.getElementById('stamp').textContent = at ? 'Agenda atualizada ' + at.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' às ' + at.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
  document.getElementById('obs').textContent = '';

  document.getElementById('kpis').innerHTML = [
    {s:'Próximo leilão Leiloingá', v: prox ? (diasAte(prox.data) === 0 ? 'Hoje' : diasAte(prox.data) + (diasAte(prox.data) === 1 ? ' dia' : ' dias')) : '—', t: prox ? `${prox.cidade.replace('-PR','')} · ${SEM[dt(prox.data).getDay()]} ${prox.data.slice(8)}/${prox.data.slice(5,7)}` : 'Nenhum na agenda', go:'agenda'},
    {s:'Leilões nos próximos 7 dias', v: sem7.length, t: `${sem7.filter(l=>l.leiloeira==='Leiloingá').length} da Leiloingá · todas as leiloeiras`, go:'agenda'},
    {s:'Leiloingá até o fim do ano', v: nossos.filter(l => l.data.slice(0,4) === hoje.slice(0,4)).length, t: 'leilões marcados na agenda', go:'agenda'},
    {s:'Alertas de tempo', v: alertas.length, t: alertas.length ? alertas.map(([k,p]) => p.cidade.replace('-PR','')).join(', ') : 'Sem alerta nos próximos leilões', go:'tempo', warn: alertas.length > 0}
  ].map(k => `<button class="kpi${k.warn?' warn':''}" type="button" data-go="${k.go}"><small>${k.s}</small><strong>${k.v}</strong><span>${esc(k.t)}</span></button>`).join('');

  /* próximo leilão */
  const p = prox, pv = p && d.previsao ? d.previsao[p.id] : null;
  const zapTxt = p ? `${p.nome} · ${p.cidade} · ${SEM[dt(p.data).getDay()]} ${p.data.slice(8)}/${p.data.slice(5,7)} · ${p.hora.replace(':','h')}\nCatálogo dos lotes: ${CATALOGO}` : '';
  document.getElementById('prox').innerHTML = p ? `
    <div class="hero">
      <div class="pic" style="background-image:url('${esc(p.banner||'og-banner.png')}')"><span class="cd">${quando(p.data)}</span></div>
      <div class="info">
        <span class="eyeb">Próximo leilão da Leiloingá</span>
        <h3>${esc(p.nome)}</h3>
        <div class="meta">
          <span><b>${SEM[dt(p.data).getDay()]}, ${Number(p.data.slice(8))} de ${MES[dt(p.data).getMonth()]}</b> às ${esc(p.hora.replace(':','h'))}</span>
          <span>${esc(p.cidade)}${p.local ? ' · ' + esc(p.local) : ''}</span>
        </div>
        ${pv ? `<div class="wx${pv.alerta?' bad':''}">${svg(pv.alerta?'alerta':'chuva')}<span><b>${pv.min}° a ${pv.max}°</b> · chuva ${pv.chuvaPct}%${pv.chuvaMm?` · ~${Math.round(pv.chuvaMm)} mm`:''}<br>${esc(pv.resumo||'')}</span></div>` : ''}
        <div class="acts">
          <button class="btn pri" type="button" data-go="fichas">${svg('fichas')}Lotes · ADM</button>
          <button class="btn" type="button" id="cp-cat">${svg('copy')}Copiar catálogo</button>
          <a class="btn" href="https://wa.me/?text=${encodeURIComponent(zapTxt)}" target="_blank" rel="noopener">${svg('zap')}WhatsApp</a>
        </div>
      </div>
    </div>` : `<div class="empty">Nenhum leilão da Leiloingá na agenda.</div>`;
  const cp = document.getElementById('cp-cat'); if (cp) cp.addEventListener('click', () => copiar(CATALOGO, 'Link do catálogo copiado'));

  /* lista */
  const nomes = ['Todas','Leiloingá','Gralha Azul','Panorama','Pampa Remates'];
  document.getElementById('filt').innerHTML = nomes.map(n => `<button class="fbtn${n===filtro?' on':''}" type="button" data-f="${n}">${n === 'Pampa Remates' ? 'Pampa' : n}</button>`).join('');
  const L = fut.filter(l => filtro === 'Todas' || l.leiloeira === filtro).slice(0, 8);
  document.getElementById('lista').innerHTML = L.length ? L.map(l => `
    <div class="row">
      <div class="date"><b>${l.data.slice(8)}</b><span>${SEM[dt(l.data).getDay()]} · ${MES[dt(l.data).getMonth()]}</span></div>
      <div><div class="nm">${esc(l.nome)}</div><div class="sub"><span class="chip" style="background:${COR[l.leiloeira]||'#3E4349'}">${esc(l.leiloeira)}</span>${esc(l.cidade)}</div></div>
      <div class="end">${l.youtube ? `<a class="yt" href="${esc(l.youtube)}" target="_blank" rel="noopener">▶ Transmissão</a>` : `<span class="hr">${esc((l.hora||'').replace(':','h'))}</span>`}</div>
    </div>`).join('') : `<div class="empty">Nenhum leilão dessa leiloeira na agenda.</div>`;

  /* tempo */
  const cs = Object.keys(d.clima || {});
  if (!cs.includes(cidade)) cidade = cs[0];
  document.getElementById('cities').innerHTML = cs.map(c => `<button class="fbtn${c===cidade?' on':''}" type="button" data-c="${esc(c)}">${esc(c.replace('-PR',''))}</button>`).join('');
  const dias = ((d.clima[cidade] || {}).dias || []).filter(x => x.data >= hoje).slice(0, 7);
  const maxmm = Math.max(30, ...dias.map(x => x.chuvaMm || 0));
  document.getElementById('days').innerHTML = dias.map(x => `
    <div class="day" title="${esc(x.resumo||'')}">
      <span class="w">${diasAte(x.data) === 0 ? 'hoje' : SEM[dt(x.data).getDay()]}</span>
      <span class="bar"><i class="${(x.chuvaMm||0) >= 25 ? 'hi' : ''}" style="height:${Math.round(((x.chuvaMm||0)/maxmm)*100)}%"></i></span>
      <span class="mm">${Math.round(x.chuvaMm||0)} mm</span>
      <span class="tp">${x.min}°/${x.max}°</span>
    </div>`).join('') || '<div class="empty">Sem previsão para essa cidade.</div>';

  /* alertas */
  document.getElementById('alerts').innerHTML = alertas.length ? alertas.map(([k,p]) => `
    <div class="al">${svg('alerta')}<div><b>${esc(p.cidade)} · ${SEM[dt(p.data).getDay()]} ${p.data.slice(8)}/${p.data.slice(5,7)}</b>${esc(p.alerta)}</div></div>`).join('')
    : `<div class="empty">Nenhum alerta para os próximos leilões da Leiloingá.</div>`;
}

document.getElementById('filt').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b){ filtro = b.dataset.f; render(); } });
document.getElementById('cities').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b){ cidade = b.dataset.c; render(); } });

document.getElementById('quick').innerHTML = [
  {go:'fichas', ic:'fichas', b:'Gerar fichas', s:'Ordem de entrada em PDF → Word'},
  {go:'boleta-pista', ic:'boleta', b:'Conferência Boleta', s:'Lances e vendidos na pista'},
  {go:'boleta-rel', ic:'boleta', b:'Pós-leilão', s:'Todos os lotes, doação e comissão'},
  {go:'relatorio', ic:'relatorio', b:'Relatório por categoria', s:'Peso, raça e idade · R$/kg'},
  {id:'q-cat', ic:'copy', b:'Copiar link do catálogo', s:'Para mandar ao cliente'},
  {go:'lotes', ic:'lotes', b:'Ver catálogo', s:'Como o produtor vê'}
].map(q => `<button class="qa" type="button" ${q.go?`data-go="${q.go}"`:`id="${q.id}"`}><span class="ic">${svg(q.ic)}</span><span><b>${q.b}</b><span>${q.s}</span></span></button>`).join('');
document.getElementById('q-cat').addEventListener('click', () => copiar(CATALOGO, 'Link do catálogo copiado'));

function carregar(){
  saudacao();
  fetch('agenda.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(j => { DADOS = j; render(); })
    .catch(() => { document.getElementById('kpis').innerHTML = '<div class="card empty">Não consegui ler a agenda agora. Tente recarregar.</div>'; });
}
carregar();

const ini = location.hash.slice(1);
ir(BY[ini] ? ini : 'inicio');
}
</script>
