<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Conferência Boleta · Leiloingá</title>
<link rel="manifest" href="icones/manifest-boleta.json">
<link rel="icon" href="icones/boleta.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/boleta-180.png">
<meta name="apple-mobile-web-app-title" content="Boleta">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f4ef;--card:#fff;--fg:#17201a;--mut:#5f6b62;--line:#d9ddd4;--v:#1f7a3a;--vs:#dcf0e1;--r:#c2501f;--rs:#fbe4d9;--a:#17201a}
@media (prefers-color-scheme:dark){:root{--bg:#111512;--card:#1a201c;--fg:#e8ece9;--mut:#9aa69d;--line:#2f3832;--v:#4fbf6e;--vs:#1c3a25;--r:#ff8a5c;--rs:#3d2318;--a:#e8ece9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,sans-serif;padding-bottom:70px}
button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top a{color:var(--mut);text-decoration:none;font-size:.85rem}
.top b{font-size:1rem;letter-spacing:.02em}.top span{color:var(--mut);font-size:.85rem}
.sel{display:flex;gap:6px;padding:8px 12px 0}
.sel select{flex:1;min-width:0;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.sel button,.bt{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;white-space:nowrap}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 0}
.bts .bt{min-height:46px}.bt.pri{background:var(--v);border-color:var(--v);color:#fff}
.msg{margin:8px 12px 0;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--mut)}.msg:empty{display:none}
.msg.err{border-color:var(--r);color:var(--r)}.msg.bom{border-color:var(--v);color:var(--v)}
.painel{margin:8px 12px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.painel h3{margin:0 0 8px;font-size:1rem}.painel p{margin:0 0 8px;color:var(--mut);font-size:.85rem}
.painel label{display:block;font-size:.75rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 3px}
.painel input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.painel .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.painel .row .bt{min-height:46px}
.painel ul{padding:0}.painel li button{white-space:nowrap}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:.75rem;color:var(--mut)}
.tot b{display:block;font-size:1.15rem;color:var(--fg)}.tot .tv b{color:var(--v)}.tot .tr b{color:var(--r)}
.lote{margin:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.lote.V{border:3px solid var(--v);background:var(--vs)}.lote.R{border:3px solid var(--r);background:var(--rs)}
.lh{display:flex;justify-content:space-between;align-items:baseline}
.ln{font-size:2.2rem;font-weight:800}.lo{color:var(--mut);font-weight:700}
.ld{font-size:1.05rem;margin-top:2px}.lv{color:var(--mut);font-size:.9rem;margin-top:2px}
.bid{margin-top:14px;text-align:center}
.bid label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.bid input{width:100%;text-align:center;font-size:3rem;font-weight:800;border:0;border-bottom:2px solid var(--line);background:transparent;padding:4px 0;font-variant-numeric:tabular-nums}
.x3{margin-top:8px;font-size:1.4rem}.x3 b{font-size:1.7rem}
.kg{display:inline-block;margin-left:8px;padding:3px 9px;border-radius:99px;font-size:.95rem;font-weight:800;vertical-align:middle;background:var(--line);color:var(--fg)}.kg.g{background:#1f7a3a;color:#fff}.kg.y{background:#e8b100;color:#1a1400}.kg.o{background:#e0661c;color:#fff}li .kg{margin:3px 0 0;font-size:.8rem}
.vlote{margin-top:12px;padding:10px;border-radius:10px;background:var(--v);color:#fff;font-weight:700;font-size:1rem}.vlote b{display:block;font-size:2rem}
.inc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.inc button{min-height:54px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:1.15rem}
.inc .mais{border-color:var(--a)}
.acao{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acao button{min-height:60px;border-radius:12px;border:3px solid;background:transparent;font-weight:800;font-size:1.15rem}
.bv{border-color:var(--v);color:var(--v)}.br{border-color:var(--r);color:var(--r)}
.bv[aria-pressed=true]{background:var(--v);color:#fff}.br[aria-pressed=true]{background:var(--r);color:#fff}
.quem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.quem button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:700}.quem button[aria-pressed=true]{background:var(--a);color:var(--bg);border-color:var(--a)}
.porq{grid-column:span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.porq div{background:var(--bg);border-radius:8px;padding:6px;font-size:.7rem}.porq b{font-size:.95rem}
.ok{display:block;width:100%;margin-top:10px;min-height:62px;border-radius:12px;border:0;background:var(--a);color:var(--bg);font-weight:800;font-size:1.25rem}
.ok[disabled]{opacity:.3}
.nav{display:flex;justify-content:space-between;margin-top:10px}.nav button{border:0;background:none;color:var(--mut);text-decoration:underline;padding:6px}
.fim{text-align:center;padding:40px 16px;color:var(--mut)}.fim b{display:block;font-size:1.4rem;color:var(--fg)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:14px 4px;font-weight:700;color:var(--mut)}.tabs button[aria-pressed=true]{color:var(--fg);box-shadow:inset 0 3px 0 var(--fg)}
ul{list-style:none;margin:0;padding:8px 12px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
li .d{color:var(--mut);font-size:.82rem}li .val{text-align:right;font-size:.85rem;color:var(--mut)}li .val b{display:block;color:var(--fg);font-size:1.05rem}
li button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:.8rem}
.fat{margin:8px 12px 0;background:var(--card);border:2px solid var(--v);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.fat div{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}.fat b{display:block;font-size:1.3rem;color:var(--fg);letter-spacing:0;text-transform:none}.fat .cm b{color:var(--v)}.fat small{grid-column:span 2;color:var(--mut);font-size:.75rem}
.hero{margin:10px 12px 0;border-radius:16px;overflow:hidden;background:#0d5c23;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero img{display:block;width:100%;aspect-ratio:16/9;max-height:300px;object-fit:cover;background:#083f18}
@media(min-width:760px){.hero{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);max-width:900px;margin:12px auto 0}.hero img{height:100%;max-height:none;aspect-ratio:auto}.hero .hi{display:flex;flex-direction:column;justify-content:center;padding:20px 24px}.hero h2{font:600 1.7rem/1.1 "Oswald",sans-serif;text-transform:uppercase}}
.hero .hi{padding:12px 14px 14px;background:linear-gradient(180deg,#0d5c23,#083f18)}
.hero .tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#f2c94c;color:#2a2000;padding:3px 8px;border-radius:99px}
.hero h2{margin:8px 0 2px;font-size:1.25rem;line-height:1.2}
.hero .qd{opacity:.9;font-size:.95rem}
.hero .hb{display:block;width:100%;margin-top:12px;min-height:52px;border:0;border-radius:12px;background:#fff;color:#0d5c23;font-weight:800;font-size:1.05rem}
.faixa{display:flex;align-items:center;gap:10px;margin:8px 12px 0;padding:6px;border-radius:12px;background:#0d5c23;color:#fff}
.faixa img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none}
.faixa .up{margin-left:auto;flex:none;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:6px 8px;font-size:.75rem;font-weight:700}
.faixa b{display:block;font-size:.9rem;line-height:1.2}.faixa span{font-size:.78rem;opacity:.85}
.bt.can{color:var(--r);border-color:var(--r)}
.mod{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:600px){.mod{align-items:center}}
.mod .cx{width:100%;max-width:440px;background:var(--card);color:var(--fg);border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mod h3{margin:0 0 6px;font-size:1.2rem}.mod p{margin:0 0 10px;color:var(--mut);font-size:.92rem}
.mod .rs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.mod .rs div{background:var(--bg);border-radius:10px;padding:8px;font-size:.75rem;color:var(--mut)}.mod .rs b{display:block;font-size:1.1rem;color:var(--fg)}
.mod .mb{display:block;width:100%;min-height:54px;margin-top:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:1.05rem}
.mod .mb.pri{background:var(--v);border-color:var(--v);color:#fff}.mod .mb.perigo{background:var(--r);border-color:var(--r);color:#fff}
.mod .mb.lev{border:0;background:none;color:var(--mut);text-decoration:underline;font-weight:600;min-height:44px}
.mod input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-size:1.1rem;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.mod .aviso{background:var(--rs);color:var(--r);border-radius:10px;padding:8px 10px;font-size:.85rem;font-weight:700}
.vazio{text-align:center;color:var(--mut);padding:30px}
.limpa{display:block;margin:10px auto 20px;border:0;background:none;color:var(--mut);text-decoration:underline}
/* ---- 5 abas, doação, relatório pós-leilão (computador) e comissão ---- */
.tabs{grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.tabs button{font-size:.92rem;padding:12px 2px;border-radius:10px;color:var(--fg)}
.tabs button[aria-pressed=true]{background:var(--v);color:#fff;box-shadow:none}
:root{--d:#a87400;--ds:#fbefc9}
@media (prefers-color-scheme:dark){:root{--d:#f2c94c;--ds:#3a3016}}
.doab{display:block;width:100%;margin-top:8px;min-height:46px;border-radius:10px;border:2px dashed var(--d);background:transparent;color:var(--d);font-weight:800;font-size:1rem}
.doab[aria-pressed=true]{background:var(--d);border-style:solid;color:#fff}
.tg{display:inline-block;font-size:.7rem;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--ds);color:var(--d);vertical-align:middle;margin-left:4px}
.rel,.cmw{padding:4px 16px 24px}.cmw{max-width:1100px;margin:0 auto}
.relh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin:8px 0 12px}
.relh h2{margin:0;font-size:1.35rem}.relh p{margin:2px 0 0;color:var(--mut);font-size:.88rem}
.relb{display:flex;gap:6px;flex-wrap:wrap}.relb .bt{min-height:40px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kp>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.74rem;color:var(--mut);font-weight:700}
.kp b{display:block;font-size:1.2rem;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.kp small{display:block;font-weight:500;font-size:.72rem;margin-top:1px}
.kp .eu{border:2px solid var(--v)}.kp .eu b{color:var(--v)}.kp .neg b{color:var(--r)}
.aviso2{margin:0 0 10px;padding:9px 12px;border-radius:10px;background:var(--ds);color:var(--d);font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.aviso2 button{border:0;background:var(--d);color:#fff;border-radius:8px;padding:7px 12px;font-weight:800}
.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.flt button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem}
.flt button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.flt input{margin-left:auto;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);min-width:220px}
.tw{overflow:auto;max-height:calc(100vh - 150px);background:var(--card);border:1px solid var(--line);border-radius:12px;scrollbar-width:auto;scrollbar-color:#9aa59c var(--bg)}
.tw::-webkit-scrollbar{width:12px;height:12px}.tw::-webkit-scrollbar-thumb{background:#9aa59c;border-radius:8px;border:3px solid var(--bg)}.tw::-webkit-scrollbar-track{background:var(--bg)}
table.rt{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
.rt th{position:sticky;top:0;background:var(--card);z-index:2;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.rt td{padding:4px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt th:first-child,.rt td:first-child{position:sticky;left:0;background:var(--card);z-index:1}.rt th:first-child{z-index:3}.rt tr.D td:first-child{background:var(--ds)}
.rt td.vd{white-space:normal;min-width:110px;max-width:150px;line-height:1.2;font-size:.82rem}
.ordb{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-left:6px}.ordb button{border:0;border-radius:0;padding:6px 12px;background:var(--card);font-weight:700;font-size:.82rem}.ordb button[aria-pressed=true]{background:var(--v);color:#fff}
@media(max-width:1250px){.rt select{max-width:96px}.rt input.la{width:76px}.rt input.cp{min-width:120px;width:120px}}
.rt .n{text-align:right}.rt th.n{text-align:right}.rt .c{text-align:center}
.rt tbody tr:hover td{background:var(--bg)}
.rt tr.V td:first-child{box-shadow:inset 4px 0 var(--v)}.rt tr.R td:first-child{box-shadow:inset 4px 0 var(--r)}.rt tr.D td:first-child{box-shadow:inset 4px 0 var(--d)}
.rt tr.R td{color:var(--mut)}.rt tr.D td{background:var(--ds)}
.rt b.lt{font-size:1rem}
.rt select,.rt input.la{padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:.86rem}
.rt input.la{width:84px;text-align:right}.rt input[type=checkbox]{width:18px;height:18px;accent-color:var(--d)}
.rt tfoot td{position:sticky;bottom:0;background:var(--card);font-weight:800;border-top:2px solid var(--line);border-bottom:0;padding:9px 8px;z-index:1}
.cmg{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;align-items:start}
.cmc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.cmc h3{margin:0 0 4px;font-size:1.02rem}.cmc>p{margin:0 0 6px;color:var(--mut);font-size:.84rem}
.cmc label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 3px}
.cmc input,.cmc select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:1rem}
.pct{position:relative;display:block}.pct input{padding-right:28px}.pct::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-weight:700}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sv{margin-top:8px;font-size:.82rem;font-weight:700;color:var(--v)}.sv.no{color:var(--d)}
.cad>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.cad>div span{color:var(--mut)}.cad b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cad .menos b{color:var(--r)}.cad .sub{font-weight:800}.cad .sub span{color:var(--fg)}.cad .eu b{color:var(--v);font-size:1.2rem}.cad .eu span{color:var(--fg);font-weight:800}
.cid{width:100%;border-collapse:collapse;font-size:.88rem}.cid td,.cid th{padding:6px 4px;white-space:nowrap;border-bottom:1px solid var(--line);text-align:left}.cid th{font-size:.7rem;color:var(--mut);text-transform:uppercase}
.cid button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-size:.78rem}
/* ===== visual Leiloingá: Poppins + Oswald, verde da marca ===== */
:root{--v:#14843A;--vs:#DCF2E2;--fg:#141A16;--bg:#F3F4F2;--line:#E1E5E0;--mut:#5D675F}
body{font-family:"Poppins","Segoe UI",system-ui,sans-serif;font-size:14.5px}
.ln,.x3 b,.vlote b,.fat b,.kp b,.vendas b,.relh h2,.capa .big,.ini h3,.pbar b{font-family:"Oswald","Arial Narrow",sans-serif;letter-spacing:.01em}
.relh h2,.ini h3{text-transform:uppercase}
.vazio{padding:48px 16px}.vazio b{display:block;font:600 1.3rem "Oswald",sans-serif;color:var(--fg);text-transform:uppercase;margin-bottom:4px}.vazio a{color:var(--v);font-weight:700}
/* cada aba mostra só o que é dela: o cabeçalho (leilão, arte, botões) fica só no Início */
.bts,.tot{display:none!important}
body:is([data-aba=pista],[data-aba=V],[data-aba=R]) .sel,body:not([data-aba=ini]) :is(#hero,#nuvemSt){display:none!important}
body:not([data-aba=ini]) #bNovo{display:none}
body[data-aba=cmp] .sel{display:none!important}
.sel select{font-weight:600}
/* barra fina da pista */
.pbar{position:relative;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin:10px 12px 0;padding:10px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:.88rem;color:var(--mut);overflow:hidden}
.pbar b{font-size:1.15rem;color:var(--fg);margin-right:3px}.pbar .g b{color:var(--v)}.pbar .o b{color:var(--r)}
.pbar i{position:absolute;left:0;bottom:0;height:4px;background:var(--v);transition:width .4s ease}
.lote{transition:border-color .2s,background .2s}
/* início do leilão */
.ini{display:grid;gap:12px;padding:12px}
.capa{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;background:#0E1410;color:#fff;border-radius:16px;padding:16px;overflow:hidden;position:relative}
.capa .ca img{display:block;width:100%;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:capaIn .7s cubic-bezier(.2,.7,.2,1)}
@keyframes capaIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.capa .ci{display:flex;flex-direction:column;gap:6px;min-width:0}
.capa .kk{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#24B53B}
.capa .lb{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#93A398;margin-top:6px}
.capa input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid #26332A;background:#151D17;color:#fff;font:inherit;font-size:1rem}
.capa input.big{font-size:1.5rem;font-weight:600;text-transform:uppercase;padding:8px 11px}
.capa input:focus{outline:2px solid #24B53B;border-color:transparent}
.capa .dois{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;padding-bottom:8px}
.prog div{background:#151D17;border:1px solid #26332A;border-radius:10px;padding:7px 9px;font-size:.75rem;color:#93A398}

/* junta os pedaços da linha; pedaços grudados (sem espaço entre eles, ex.: "1" e "2" que formam o 12 da coluna Ord.) viram um só */
function juntaLinha(g){
  var its=g.its.slice().sort(function(a,b){return a.x-b.x;}),s="",ant=null;
  its.forEach(function(i){
    if(ant&&(i.x-ant.r)<Math.min(ant.cw,i.cw)*0.3&&(i.x-ant.r)>-Math.min(ant.cw,i.cw)*0.5)s+=i.s;

var ULT_GRUPOS=[];

function linhasDaPagina(items){
  var its=items.filter(function(i){return i.str&&i.str.trim();}).map(function(i){
    var lead=i.str.length-i.str.replace(/^\s+/,"").length,cw=(i.width&&i.str.length)?i.width/i.str.length:5;

  var nums=its.filter(function(i){return /^\d{1,3}º?$/.test(i.s);});

  }
  its.forEach(function(i){
    var g=grupos.length?grupos[grupos.length-1]:null;

}
var RE_LINHA=/^(\d{1,4})\s+(\d{1,4})\s+(\d{1,4})\s*([MF])\s+(.+?)\s+((?:\d{1,2}\s*A\s*\d{1,2}|\d{1,2}\s*\/\s*\d{1,2})\s*M\w*|\+\s*\d{1,2}\s*M\w*)\s+(.+?)\s+(\d{2,4})(?:[.,]\d+)?(?:\s.*)?$/i;

function interpretar(linhas){
  var out={leilao:"",data:"",totais:null,lotes:[],naoEntendi:[]};

    t=t.replace(/^(\d{1,3})\s+(\d{1,3})(?=\s+\d{2,4}\s+\d{1,4}\s*[MF]\b)/i,"$1$2");

    }

      v[k]=(v[k]?v[k]+" ":"")+p.s;
    });
    /* número de qtde e sexo às vezes vêm grudados ("7M") ou na coluna vizinha */
    var qs=((v.qtde||"")+" "+(v.sexo||"")).trim(),m=qs.match(/(\d{1,4})\s*([MF])\b/i);
    var lote=(v.lote||"").match(/\d{1,4}/);
    if(!lote||!m)return;
    lotes.push({ord:+((v.ord||"").match(/\d+/)||[0])[0]||null,lote:lote[0],qtde:+m[1],sexo:m[2].toUpperCase(),
      vendedor:(v.vendedor||"").trim(),idade:(v.idade||"").trim(),raca:(v.raca||"").trim(),peso:+(((v.peso||"").match(/\d{2,4}/)||[""])[0])||null});
  });
  return lotes;
}
async function lerPdf(file){
  var buf=new Uint8Array(await file.arrayBuffer());
  var doc=await abrirDoc(buf);
  var linhas=[],grupos=[];
  for(var p=1;p<=doc.numPages;p++){
    var page=await doc.getPage(p);
    var tc=await page.getTextContent();
    linhas=linhas.concat(linhasDaPagina(tc.items));
    grupos=grupos.concat(ULT_GRUPOS);
  }
  var meta=null;try{meta=await doc.getMetadata();}catch(e){}
  var info=interpretar(linhas);
  if(info.lotes.some(function(l){return l.duvida;})){
    var pc=porColunas(grupos);
    info.lotes=info.lotes.map(function(l){
      if(!l.duvida)return l;
      var a=pc.find(function(x){return loteN(x.lote)===loteN(l.lote);});
      return a||l;
    });
    info.naoEntendi=info.lotes.filter(function(l){return l.duvida;}).map(function(l){return l.bruto;});
  }
  return {linhas:linhas,info:info,meta:meta};
}
return {lerPdf:lerPdf,loteN:loteN};
})();

function api(path,opt){opt=opt||{};var h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+GH.token,"X-GitHub-Api-Version":"2022-11-28"};
  if(opt.headers)for(var k in opt.headers)h[k]=opt.headers[k];

function caminho(p){return "/repos/"+DONO+"/"+GH.repo+"/contents/"+p.split("/").map(encodeURIComponent).join("/")}
function b64enc(str){var b=new TextEncoder().encode(str),s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){var s=atob(String(b).replace(/\s/g,"")),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
async function ler(p){var r=await api(caminho(p));if(r.status===404)return null;if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}

async function decifra(senha,c){
  function d64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(c.sal),iterations:c.iter||600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(c.iv)},k,d64(c.dados))));
}

/* lotes na ordem de entrada da página dos produtores (LOTES: lotes.csv + ordem.txt);

async function lotesDoSite(){

  return {lotes:deLinhas(lin,ordem),temOrdem:ordem.length>0};
}

  return t.split(/[\s,;]+/).map(function(x){return parseInt(x,10)}).filter(function(n){return n>0})}catch(e){return[]}}
function deLinhas(lin,ordem){
  var pos={};(ordem||[]).forEach(function(n,k){pos[n]=k});
  lin.sort(function(a,b){var pa=pos[a.l]!=null?pos[a.l]:(a.ord!=null?1000+a.ord:5000+a.l),pb=pos[b.l]!=null?pos[b.l]:(b.ord!=null?1000+b.ord:5000+b.l);return pa-pb});
  return lin.map(function(x,k){return{o:k+1,l:+x.l,q:+x.q||0,s:x.s==="F"?"F":"M",v:x.v||"",r:x.r||"",i:x.i||"",p:+x.p||0}});
}
async function listaGh(){if(precisaToken())return;msg("Buscando no GitHub…");
  try{var r=await api(caminho("boletas"));if(r.status===404){msg("Ainda não há boletas salvas no GitHub.");return}var it=(await r.json()).filter(function(f){return /\.json$/.test(f.name)});
    msg("");$("extra").innerHTML='<div class="painel"><h3>Boletas salvas no GitHub</h3><ul>'+it.map(function(f){return '<li><span>'+esc(f.name.replace(/\.json$/,""))+'</span><button type="button" data-p="'+esc(f.path)+'">Abrir</button></li>'}).join("")+'</ul></div>';
    $("extra").querySelectorAll("button[data-p]").forEach(function(b){b.onclick=async function(){try{var j=await ler(b.dataset.p);importaJson(JSON.parse(b64dec(j.content)))}catch(e){msg("Erro ao abrir: "+e.message,"err")}}})}
  catch(e){msg("Não consegui listar ("+e.message+").","err")}}
function importaJson(s){if(!s||!s.L||!s.id)throw new Error("arquivo inválido");s.alterado=s.alterado||new Date().toISOString();s.st=s.st||{};s.la=s.la||{};s.qm=s.qm||{};s.cur=s.cur||0;DB.sess[s.id]=s;$("extra").innerHTML="";abrir(s.id);msg("Aberto: "+titulo(s),"bom")}
/* texto do botão "Copiar dados para o relatório" da boleta antiga */
function importaTexto(t){var lin=t.trim().split(/\r?\n/),cab=lin.shift(),hd=lin.shift();var nome=(cab||"").replace(/^RELATORIO\s+/i,"").trim();
  var lotes=[],st={},la={},qm={};lin.forEach(function(x){var c=x.split(";");if(c.length<9)return;var l=+c[1];
    lotes.push({o:+c[0],l:l,q:+c[2],s:c[3]==="F"?"F":"M",r:c[4],i:c[5],p:+c[6],v:c[7]});
    if(c[8]==="VENDIDO")st[l]="V";else if(c[8]==="RETORNO")st[l]="R";var n=lnum(c[9]);if(n!=null)la[l]=n;if(c[10])qm[l]=c[10].trim()});
  if(!lotes.length)throw new Error("texto sem lotes");
  var s=novaSessao(($("nNome")&&$("nNome").value.trim())||cap(nome)||"Leilão",$("nData")?$("nData").value:"",lotes,QUEM_PADRAO.slice());s.st=st;s.la=la;s.qm=qm;
  DB.sess[s.id]=s;$("extra").innerHTML="";abrir(s.id);msg("Importado: "+lotes.length+" lotes.","bom")}

/* ---------- contas do relatório ---------- */
function kgInfo(v,x){if(!v||!x.p)return null;var k=v*3/x.p;return {k:k,c:k>17?"g":k>=16?"y":"o"}}
function kgHtml(v,x){var i=kgInfo(v,x);return i?'<span class="kg '+i.c+'">R$ '+f2(i.k)+'/kg</span>':""}
function grupo(lst){var o={lotes:0,cab:0,fat:0,kg:0};lst.forEach(function(x){var v=S.la[x.l]||0;o.lotes++;o.cab+=x.q;o.fat+=v*3*x.q;if(v)o.kg+=x.q*x.p});o.mc=o.cab?o.fat/o.cab:0;o.mk=o.kg?o.fat/o.kg:0;return o}
function contas(){
  var V=L.filter(function(x){return S.st[x.l]==="V"}),R=L.filter(function(x){return S.st[x.l]==="R"});
  var g=grupo(V),cabT=L.reduce(function(a,x){return a+x.q},0);
  var porSexo={M:grupo(V.filter(function(x){return x.s==="M"})),F:grupo(V.filter(function(x){return x.s==="F"}))};
  var rac={};V.forEach(function(x){(rac[x.r]=rac[x.r]||[]).push(x)});var porRaca=Object.keys(rac).map(function(k){var o=grupo(rac[k]);o.nome=k;return o}).sort(function(a,b){return b.mk-a.mk});
  var porQuem=quem().map(function(n){var l=V.filter(function(x){return S.qm[x.l]===n});var o=grupo(l);o.nome=n;o.ls=l.map(function(x){return z(x.l)});return o});
  var sem=V.filter(function(x){return !S.qm[x.l]});if(sem.length){var o=grupo(sem);o.nome="Sem nome";o.ls=[];porQuem.push(o)}
  var faixa={g:0,y:0,o:0};V.forEach(function(x){var i=kgInfo(S.la[x.l],x);if(i)faixa[i.c]++});
  var comKg=V.filter(function(x){return kgInfo(S.la[x.l],x)}).sort(function(a,b){return kgInfo(S.la[b.l],b).k-kgInfo(S.la[a.l],a).k});
  var ret=grupo(R);
  return {V:V,R:R,g:g,cabT:cabT,porSexo:porSexo,porRaca:porRaca,porQuem:porQuem,faixa:faixa,melhores:comKg.slice(0,5),piores:comKg.slice(-5),ret:ret,falta:L.length-V.length-R.length};
}

function cidadeDe(s){if(s.cidade)return s.cidade.replace(/-[A-Z]{2}$/,"");var m=/\s[–-]\s*([^–-]+)$/.exec(s.nome||"");return m?m[1].trim():""}
function com(){if(!S)return null;if(!S.doa)S.doa={};
  if(!S.com){var c=cidadeDe(S),sv=CM[slug(c)]||null;
    S.com={cidade:c,comp:sv?sv.comp:null,vend:sv?sv.vend:null,leil:sv&&sv.leil?sv.leil:LEILOEIROS[0].n,leilP:sv&&sv.leilP!=null?sv.leilP:LEILOEIROS[0].p,rural:sv&&sv.rural!=null?sv.rural:RURAL_PADRAO,piq:PIQ_PADRAO,eu:EU_PADRAO,daCidade:!!sv}}
  return S.com}
function calc(){var c=com(),o={bruto:0,doa:0,nDoa:0,cab:0};
  L.forEach(function(x){if(S.st[x.l]!=="V")return;var v=(S.la[x.l]||0)*3*x.q;o.bruto+=v;o.cab+=x.q;if(S.doa[x.l]){o.doa+=v;o.nDoa++}});
  o.base=o.bruto-o.doa;o.pc=(c.comp||0)/100;o.pv=(c.vend||0)/100;o.cComp=o.base*o.pc;o.cVend=o.base*o.pv;o.cTot=o.cComp+o.cVend;
  o.ruralP=c.rural==null?RURAL_PADRAO:c.rural;o.rural=o.cTot*o.ruralP/100;o.casa=o.cTot-o.rural;o.leil=o.base*(c.leilP||0)/100;o.liq=o.casa-o.leil;o.piq=o.liq*(c.piq||0)/100;o.sobra=o.liq-o.piq;o.eu=o.sobra*(c.eu||0)/100;
  o.efet=o.bruto?o.eu/o.bruto*100:0;o.semTaxa=c.comp==null&&c.vend==null;return o}

  ["Comissão do comprador",pc(C.comp),brl(K.cComp),""],
  ["Comissão do vendedor",pc(C.vend),brl(K.cVend),""],
  ["Comissão total",pc((C.comp||0)+(C.vend||0)),brl(K.cTot),"sub"],

  ["Leiloeiro · "+(C.leil||"—"),pc(C.leilP)+" da base","- "+brl(K.leil),"menos"],
  ["Líquido da leiloeira","",brl(K.liq),"sub"],

    var mud=[];
    S.L.forEach(function(x){var a=fonte[x.l];if(!a)return;var det=[];
      if(a.q&&a.q!==x.q){det.push(x.q+"→"+a.q+" cab.");x.q=a.q}

    /* lotes novos no Lotes ADM entram no fim; lotes excluídos lá saem daqui se ainda não têm lance nem marcação */
    var tem={};S.L.forEach(function(x){tem[x.l]=1});

  }finally{SINC.rod=false}
}

/* ---------- Anexar PDF no Pós-leilão ----------
   Aceita: (1) o PDF da própria boleta (os novos trazem os dados completos escondidos; os antigos são lidos pela tabela);
   (2) a ordem de entrada do sistema (lotes, vendedor, peso). Se já existe leilão do mesmo dia aqui, junta nele. */
function upB(x){return String(x==null?"":x).trim().replace(/\s+/g," ").toUpperCase()}
function isoData(d){d=String(d||"").trim();var m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m)return (m[3].length===2?"20"+m[3]:m[3])+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);return /^\d{4}-\d{2}-\d{2}$/.test(d)?d:""}
function sessDoDia(d){if(!d)return null;for(var k in DB.sess)if(DB.sess[k].data===d)return DB.sess[k];return null}
function tabelaBoleta(linhas){
  var out={L:[],st:{},la:{},qm:{},cp:{}},nome="",data="";
  linhas.forEach(function(t,k){if(!nome&&/Confer[êe]ncia Boleta/i.test(t)){var q=linhas[k+1]||"",m=q.match(/^(.*?)\s*·\s*(\d{2}\/\d{2}\/\d{4})/);if(m){nome=m[1].trim();data=isoData(m[2])}}
    var m=t.match(/^(\d{1,3})º\s+(\d{1,4})\s+(\d{1,4})\s+([MF])\s+(.+?)\s+(\d{2,4})\s*kg\s+(.*)$/);if(!m)return;
    var mio=m[5],id="",r=mio,im=mio.match(/^(.*?)\s+(\d{1,2}\s*\/\s*\d{1,2}(?:\s*M)?|\d{1,2}\s*M|\d{1,2}\s*a\s*\d{1,2}\s*M?)$/i);if(im){r=im[1];id=im[2]}
    var resto=m[7],sm=resto.match(/^(.*?)\s*\b(Vendido|Retorno|Doação|Doacao|—|-)\s+(\S+)(.*)$/),v=resto,s="",la=null,tail="";
    if(sm){v=sm[1];s=sm[2];la=lnum(sm[3]);tail=sm[4]}
    var l=+m[2];out.L.push({o:+m[1],l:l,q:+m[3],s:m[4],r:r.trim(),i:id.trim(),p:+m[6],v:v.trim()});
    if(/Vend|Doa/.test(s))out.st[l]="V";else if(/Ret/.test(s))out.st[l]="R";if(/Doa/.test(s)){out.doa=out.doa||{};out.doa[l]=true}
    if(la!=null&&la>0)out.la[l]=la;
    var nomes=quem();nomes.forEach(function(n){if(new RegExp("\\b"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(tail))out.qm[l]=n});
  });
  out.nome=nome;out.data=data;return out}
function juntaNaSessao(alvo,nova,comValores){
  var por={};alvo.L.forEach(function(x){por[x.l]=x});var mud=0,novos=0;
  nova.L.forEach(function(x){var a=por[x.l];if(!a){alvo.L.push(Object.assign({},x,{o:alvo.L.length+1}));novos++;return}
    ["q","s","r","i","p","v"].forEach(function(k){if(x[k]&&x[k]!==a[k]){a[k]=x[k];mud++}})});
  if(comValores){["st","la","qm","cp","doa"].forEach(function(k){if(!nova[k])return;alvo[k]=alvo[k]||{};Object.keys(nova[k]).forEach(function(l){if(alvo[k][l]!==nova[k][l]){alvo[k][l]=nova[k][l];mud++}})})}
  alvo.alterado=new Date().toISOString();return {mud:mud,novos:novos}}
async function anexarPdf(f){
  msg("Lendo o PDF…");
  try{
    var r=await LEPDF.lerPdf(f),kw=r.meta&&r.meta.info&&r.meta.info.Keywords||"";
    /* 1) PDF da boleta com os dados completos */
    if(/^LEILOINGA-BOLETA:/.test(kw)){var x=JSON.parse(b64dec(kw.slice(17)));x.st=x.st||{};x.la=x.la||{};x.qm=x.qm||{};x.cur=x.cur||0;
      var ja=DB.sess[x.id];if(ja&&(ja.alterado||"")>(x.alterado||"")&&!confirm("Este aparelho tem uma versão mais nova deste leilão. Trocar pela do PDF?")){abrir(ja.id);tab="rel";marcaTab();render();msg("Mantive a versão deste aparelho.");return}
      DB.sess[x.id]=x;abrir(x.id);tab="rel";marcaTab();render();msg("PDF da boleta aberto: "+titulo(x)+" · "+x.L.length+" lotes com lances e situação.","bom");return}
    /* 2) PDF antigo da boleta: lê a tabela completa dos lotes */
    var tb=tabelaBoleta(r.linhas||[]);
    if(tb.L.length){var al=sessDoDia(tb.data);
      if(al){var j=juntaNaSessao(al,tb,true);abrir(al.id);tab="rel";marcaTab();salva();render();msg("PDF da boleta juntado em "+titulo(al)+": "+j.mud+" informações atualizadas"+(j.novos?", "+j.novos+" lotes novos":"")+".","bom");return}
      var s=novaSessao(tb.nome||f.name.replace(/\.pdf$/i,""),tb.data,tb.L,quem().slice());s.st=tb.st;s.la=tb.la;s.qm=tb.qm;if(tb.doa)s.doa=tb.doa;
      if(DB.sess[s.id])s.id+="-"+Date.now().toString(36).slice(-4);DB.sess[s.id]=s;abrir(s.id);tab="rel";marcaTab();salva();render();
      msg("PDF da boleta aberto: "+tb.L.length+" lotes. Confira lances e situação na tabela.","bom");return}
    /* 3) ordem de entrada do sistema */
    var info=r.info,ls=(info.lotes||[]).filter(function(l){return !l.duvida&&LEPDF.loteN(l.lote)!=null});
    if(!ls.length){msg("Não achei lotes nesse PDF. Use a ordem de entrada do sistema ou o PDF gerado pela boleta.","err");return}
    var lin=ls.map(function(l){return{l:LEPDF.loteN(l.lote),q:l.qtde||0,s:/^f/i.test(l.sexo||"")?"F":"M",v:upB(l.vendedor),r:upB(l.raca),i:upB(l.idade),p:l.peso||0,ord:l.ord||null}});
    var lotes=deLinhas(lin,[]),dt=isoData(info.data),nome=String(info.leilao||"").replace(/\s*-\s*ORDEM DE ENTRADA\s*$/i,"").trim();
    var al2=sessDoDia(dt);
    if(al2){var j2=juntaNaSessao(al2,{L:lotes},false);abrir(al2.id);tab="rel";marcaTab();salva();render();msg("Ordem de entrada juntada em "+titulo(al2)+": "+j2.mud+" correções"+(j2.novos?", "+j2.novos+" lotes novos":"")+". Lances e marcações foram mantidos.","bom");return}
    var s2=novaSessao(cap(nome)||f.name.replace(/\.pdf$/i,""),dt,lotes,quem().slice());
    if(DB.sess[s2.id])s2.id+="-"+Date.now().toString(36).slice(-4);DB.sess[s2.id]=s2;abrir(s2.id);tab="rel";marcaTab();salva();render();
    msg(lotes.length+" lotes lidos da ordem de entrada. Agora é só marcar a situação e digitar os lances na tabela.","bom");
  }catch(e){console.error(e);msg(/password/i.test(e&&e.message||"")?"Esse PDF tem senha. Gere de novo sem senha.":"Não consegui abrir esse PDF ("+(e&&e.message||e)+").","err")}
}

async function enviaNuvem(){
  if(!GH.token||!S)return;if(NV.enviando){NV.timer=setTimeout(enviaNuvem,1000);return}
  NV.enviando=true;NV.pend=false;var s=S;
  try{var p=caminhoB(s.id),body={message:"Boleta: "+titulo(s),content:b64enc(JSON.stringify(s,null,1)+"\n")};
    if(NV.sha[s.id]===undefined){var at=await ler(p);NV.sha[s.id]=at?at.sha:null}
    if(NV.sha[s.id])body.sha=NV.sha[s.id];
    var r=await api(caminho(p),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){var at2=await ler(p);NV.sha[s.id]=at2?at2.sha:null;NV.enviando=false;return enviaNuvem()}
    if(!r.ok)throw new Error(r.status);NV.sha[s.id]=(await r.json()).content.sha;
    nvTxt("☁ Salvo na nuvem · aparece nos outros aparelhos","var(--v)")}
  catch(e){nvTxt("Sem internet · fica salvo aqui e envia quando voltar","var(--r)");NV.pend=true;setTimeout(function(){if(NV.pend)enviaNuvem()},8000)}
  NV.enviando=false}

function ytId(u){var m=/[?&]v=([\w-]{11})|youtu\.be\/([\w-]{11})/.exec(u||"");return m?(m[1]||m[2]):""}
function quando(x){var p=(x.data||"").split("-");if(p.length<3)return "";var dt=new Date(+p[0],p[1]-1,+p[2]);return SEM[dt.getDay()]+", "+p[2]+"/"+p[1]+(x.hora?" · "+x.hora.replace(":","h"):"")}
