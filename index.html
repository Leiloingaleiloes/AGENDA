<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E6A3E">
<title>Leiloingá</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Leiloingá · Agenda / P. Tempo">
<meta property="og:description" content="Agenda de leilões e previsão do tempo.">
<meta property="og:url" content="https://leiloingaleiloes.github.io/AGENDA/">
<meta property="og:image" content="https://leiloingaleiloes.github.io/AGENDA/og-banner.png">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: site de computador — faixa superior, agenda por leiloeira à esquerda, painel de tempo fixo à direita */
:root {
  --bg: #EDEEF0;
  --surface: #FFFFFF;
  --surface-2: #F5F6F7;
  --line: #DADDE1;
  --fg: #1D2024;
  --muted: #5D636B;
  --accent: #2E6A3E;
  --accent-soft: #E1EDE3;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --alert: #B42318;
  --alert-soft: #FDE7E4;
  --rain: #2F6FB0;
  --sun: #E0A100;
  --cloud: #A9B4AE;
  --cloud-2: #7D8A83;
  /* cores das leiloeiras: usadas como preenchimento com texto branco */
  --c-leiloinga: #2E6A3E;
  --c-leiloinga-dark: #161B18;
  --c-gralha: #123E7A;
  --c-panorama: #0A8299;
  --c-pampa: #5B6E62;
  --c-todas: #3E4349;
  --on-brand: #FFFFFF;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141517; --surface: #1C1E21; --surface-2: #222529; --line: #31353B; --fg: #E8EAED; --muted: #9DA3AB;
  --accent: #7CC48C; --accent-soft: #1F3326; --warn: #F0B45A; --warn-soft: #3A2C14;
  --alert: #FF8A7A; --alert-soft: #3D1E1A; --rain: #7FB2F0; --sun: #F0C45A; --cloud: #8D9A93; --cloud-2: #66736C;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141517; --surface: #1C1E21; --surface-2: #222529; --line: #31353B; --fg: #E8EAED; --muted: #9DA3AB;
  --accent: #7CC48C; --accent-soft: #1F3326; --warn: #F0B45A; --warn-soft: #3A2C14;
  --alert: #FF8A7A; --alert-soft: #3D1E1A; --rain: #7FB2F0; --sun: #F0C45A; --cloud: #8D9A93; --cloud-2: #66736C;
  color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
a { color: inherit; }
button { font: inherit; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 24px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; }
h1 span { color: var(--accent); }
.brandhead { display: flex; align-items: center; gap: 18px; min-width: 0; }
.logo { height: 38px; width: auto; max-width: 220px; object-fit: contain; display: block; }
@media (max-width: 640px) { .logo { height: 32px; } }
.homebtn { font: 600 .86rem var(--f-body); text-decoration: none; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); white-space: nowrap; }
.homebtn:hover { border-color: var(--muted); }
.stamp { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.layout { max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; }
main, aside { min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .07em; margin: 0 0 12px; color: var(--muted); }


.hub { max-width: 1000px; margin: 0 auto; padding: 32px max(24px, env(safe-area-inset-left, 0px)) 56px; }
.hub h2 { margin-bottom: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: 12px; text-decoration: none; color: var(--fg); min-height: 150px; }
.card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card svg { width: 34px; height: 34px; color: var(--accent); }
.card .t { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; text-transform: uppercase; letter-spacing: .03em; line-height: 1.1; }
.card .d { font-size: .9rem; color: var(--muted); }
.card.soon { border-top-color: var(--line); background: var(--surface-2); color: var(--muted); cursor: default; }
.card.soon:hover { border-color: var(--line); box-shadow: none; }
.card.soon svg { color: var(--muted); }
.soon-tag { align-self: flex-start; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 4px; background: var(--line); color: var(--muted); }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brandhead"><img class="logo" src="logo-leiloinga.png" alt="Leiloingá" onerror="this.remove()"><h1>Leiloingá <span>Painel</span></h1></div>
</div></div>

<div class="hub">
  <h2>Escolha uma área</h2>
  <div class="cards">
    <a class="card" href="agenda.html">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.3"/></svg>
      <span class="t">Agenda de leilões</span>
      <span class="d">Leiloingá, Gralha Azul, Panorama e Pampa Remates, com transmissão e previsão do tempo.</span>
    </a>
    <a class="card" href="tempo.html">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="18" cy="17" r="7" fill="currentColor" opacity=".35"/><path fill="currentColor" d="M15 40h22a7 7 0 0 0 .9-13.9A10 10 0 0 0 19 25.5 7.3 7.3 0 0 0 15 40z"/></svg>
      <span class="t">Previsão do tempo</span>
      <span class="d">Mapa e 10 dias de previsão das cidades dos leilões da Leiloingá.</span>
    </a>
    <div class="card soon" aria-disabled="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h9M5.5 8h9M5.5 12h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="2.2" cy="4" r="1.1" fill="currentColor"/><circle cx="2.2" cy="8" r="1.1" fill="currentColor"/><circle cx="2.2" cy="12" r="1.1" fill="currentColor"/></svg>
      <span class="soon-tag">Em breve</span>
      <span class="t">Lotes do leilão</span>
      <span class="d">Lotes de cada leilão.</span>
    </div>
  </div>
</div>
</body>
</html>
