<script>
/* Conferência Boleta: marca na pista vendido/retorno, lance e corretor de cada lote.
   Cada leilão fica salvo neste aparelho; "Salvar no GitHub" grava boletas/<id>.json e boletas/<id>.pdf
   no repositório PRIVADO do ADM (o mesmo token do Lotes · ADM). Os valores nunca vão para repositório público. */
var DONO="Leiloingaleiloes",PUB="LOTES",QUEM_PADRAO=["Piquiri","Carlos","Cezeta"];
/* comissão: % do comprador + % do vendedor da praça (salvo por cidade); metade (ajustável por cidade) fica com a Rural; o leiloeiro sai do bruto e é
   descontado da comissão da leiloeira; do líquido, 10% é do Piquiri e, do que sobra, 7% é a minha. Doação não gera comissão. */
var LEILOEIROS=[{n:"Max Teddy",p:0.5},{n:"Tadeu",p:0.4}],PIQ_PADRAO=10,EU_PADRAO=7,RURAL_PADRAO=50;
var KC="leiloinga-comissoes-v1",CM={};try{CM=JSON.parse(localStorage.getItem(KC)||"{}")||{}}catch(e){CM={}}
var RF={f:"todos",q:""};
var GH={token:"",repo:"ADM"};
try{var gx=JSON.parse(localStorage.getItem("leiloinga-adm-gh")||"null");if(gx&&gx.token){GH.token=gx.token;GH.repo=gx.repo||"ADM";}}catch(e){}
var KB="leiloinga-boleta-v1",DB={atual:null,sess:{}};
try{var y=JSON.parse(localStorage.getItem(KB)||"null");if(y&&y.sess)DB=y;}catch(e){}
var S=null,L=[],tab="pista",arm=false,pend=null,PROX=null;
var SEM=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

function $(i){return document.getElementById(i)}
function salvaLocal(){try{localStorage.setItem(KB,JSON.stringify(DB))}catch(e){}}
function salva(){if(S){S.alterado=new Date().toISOString();}salvaLocal();if(S)agendaNuvem()}
function msg(t,c){var m=$("msg");m.textContent=t||"";m.className="msg"+(c?" "+c:"")}
function z(n){return n<10?"0"+n:""+n}
function brl(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function fmt(n){return n.toLocaleString("pt-BR",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function f2(n){return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function lnum(s){s=String(s==null?"":s).trim();if(!s)return null;if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");var n=parseFloat(s);return isNaN(n)?null:n}
function slug(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function dataBR(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?m[3]+"/"+m[2]+"/"+m[1]:(d||"")}
function titulo(s){return (s.nome||"Leilão")+(s.data?" · "+dataBR(s.data):"")}

/* ---------- GitHub (repositório privado do ADM) ---------- */
function api(path,opt){opt=opt||{};var h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+GH.token,"X-GitHub-Api-Version":"2022-11-28"};
  if(opt.headers)for(var k in opt.headers)h[k]=opt.headers[k];
  return fetch("https://api.github.com"+path,{method:opt.method||"GET",headers:h,body:opt.body,cache:"no-store"})}
function caminho(p){return "/repos/"+DONO+"/"+GH.repo+"/contents/"+p.split("/").map(encodeURIComponent).join("/")}
function b64enc(str){var b=new TextEncoder().encode(str),s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){var s=atob(String(b).replace(/\s/g,"")),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
async function ler(p){var r=await api(caminho(p));if(r.status===404)return null;if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}
async function gravar(p,b64,m){var at=await ler(p);var body={message:m,content:b64};if(at&&at.sha)body.sha=at.sha;
  var r=await api(caminho(p),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error("GitHub "+r.status)}

      if(!r.ok)throw new Error("A senha do ADM ainda não foi criada (crie no Lotes · ADM, no botão da nuvem).");
      var c=await r.json(),o;try{o=await decifra(s,c)}catch(e){throw new Error("Senha errada.")}

async function decifra(senha,c){
  function d64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(c.sal),iterations:c.iter||600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(c.iv)},k,d64(c.dados))));
}

/* lotes na ordem de entrada da página dos produtores (LOTES: lotes.csv + ordem.txt);
   o nome do vendedor vem do Lotes · ADM quando este aparelho tem o token */
async function lotesDoSite(){
  var raw="https://raw.githubusercontent.com/"+DONO+"/"+PUB+"/main/";
  var t=await (await fetch(raw+"lotes.csv?t="+Date.now(),{cache:"no-store"})).text();
  var lin=t.trim().split(/\r?\n/).slice(1).map(function(x){var c=x.split(";");return{l:+c[0],r:c[1]||"",i:c[2]||"",s:/^f/i.test(c[3]||"")?"F":"M",q:+c[4]||0,p:+c[5]||0,v:""}}).filter(function(x){return x.l>0});
  var ordem=await ordemSite();
  if(ordem.length){var tem={};lin.forEach(function(x){tem[x.l]=1});ordem.forEach(function(n){if(!tem[n])lin.push({l:n,r:"",i:"",s:"M",q:0,p:0,v:""})})}
  if(GH.token){try{var j=await ler("fichas.json");if(j){var d=JSON.parse(b64dec(j.content)),vv={};(d.rows||[]).forEach(function(r){if(r.lote!=null)vv[r.lote]=r.vendedor||""});lin.forEach(function(x){if(vv[x.l])x.v=vv[x.l]})}}catch(e){}}
  return {lotes:deLinhas(lin,ordem),temOrdem:ordem.length>0};
}

function deLinhas(lin,ordem){
  var pos={};(ordem||[]).forEach(function(n,k){pos[n]=k});
  lin.sort(function(a,b){var pa=pos[a.l]!=null?pos[a.l]:(a.ord!=null?1000+a.ord:5000+a.l),pb=pos[b.l]!=null?pos[b.l]:(b.ord!=null?1000+b.ord:5000+b.l);return pa-pb});
  return lin.map(function(x,k){return{o:k+1,l:+x.l,q:+x.q||0,s:x.s==="F"?"F":"M",v:x.v||"",r:x.r||"",i:x.i||"",p:+x.p||0}});
}
async function listaGh(){if(precisaToken())return;msg("Buscando no GitHub…");
  try{var r=await api(caminho("boletas"));if(r.status===404){msg("Ainda não há boletas salvas no GitHub.");return}var it=(await r.json()).filter(function(f){return /\.json$/.test(f.name)});
    msg("");$("extra").innerHTML='<div class="painel"><h3>Boletas salvas no GitHub</h3><ul>'+it.map(function(f){return '<li><span>'+esc(f.name.replace(/\.json$/,""))+'</span><button type="button" data-p="'+esc(f.path)+'">Abrir</button></li>'}).join("")+'</ul></div>';
    $("extra").querySelectorAll("button[data-p]").forEach(function(b){b.onclick=async function(){try{var j=await ler(b.dataset.p);importaJson(JSON.parse(b64dec(j.content)))}catch(e){msg("Erro ao abrir: "+e.message,"err")}}})}
  catch(e){msg("Não consegui listar ("+e.message+").","err")}}
function importaJson(s){if(!s||!s.L||!s.id)throw new Error("arquivo inválido");s.alterado=s.alterado||new Date().toISOString();s.st=s.st||{};s.la=s.la||{};s.qm=s.qm||{};s.cur=s.cur||0;DB.sess[s.id]=s;$("extra").innerHTML="";abrir(s.id);msg("Aberto: "+titulo(s),"bom")}
/* texto do botão "Copiar dados para o relatório" da boleta antiga */
function importaTexto(t){var lin=t.trim().split(/\r?\n/),cab=lin.shift(),hd=lin.shift();var nome=(cab||"").replace(/^RELATORIO\s+/i,"").trim();
  var lotes=[],st={},la={},qm={};lin.forEach(function(x){var c=x.split(";");if(c.length<9)return;var l=+c[1];
    lotes.push({o:+c[0],l:l,q:+c[2],s:c[3]==="F"?"F":"M",r:c[4],i:c[5],p:+c[6],v:c[7]});
    if(c[8]==="VENDIDO")st[l]="V";else if(c[8]==="RETORNO")st[l]="R";var n=lnum(c[9]);if(n!=null)la[l]=n;if(c[10])qm[l]=c[10].trim()});
  if(!lotes.length)throw new Error("texto sem lotes");
  var s=novaSessao(($("nNome")&&$("nNome").value.trim())||cap(nome)||"Leilão",$("nData")?$("nData").value:"",lotes,QUEM_PADRAO.slice());s.st=st;s.la=la;s.qm=qm;
  DB.sess[s.id]=s;$("extra").innerHTML="";abrir(s.id);msg("Importado: "+lotes.length+" lotes.","bom")}
$("arq").onchange=function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var t=String(rd.result);if(/^\s*\{/.test(t))importaJson(JSON.parse(t));else importaTexto(t)}catch(er){msg("Não consegui abrir: "+er.message,"err")}};rd.readAsText(f);e.target.value=""};

/* ---------- contas do relatório ---------- */
function kgInfo(v,x){if(!v||!x.p)return null;var k=v*3/x.p;return {k:k,c:k>17?"g":k>=16?"y":"o"}}
function kgHtml(v,x){var i=kgInfo(v,x);return i?'<span class="kg '+i.c+'">R$ '+f2(i.k)+'/kg</span>':""}
function grupo(lst){var o={lotes:0,cab:0,fat:0,kg:0};lst.forEach(function(x){var v=S.la[x.l]||0;o.lotes++;o.cab+=x.q;o.fat+=v*3*x.q;if(v)o.kg+=x.q*x.p});o.mc=o.cab?o.fat/o.cab:0;o.mk=o.kg?o.fat/o.kg:0;return o}
function contas(){
  var V=L.filter(function(x){return S.st[x.l]==="V"}),R=L.filter(function(x){return S.st[x.l]==="R"});
  var g=grupo(V),cabT=L.reduce(function(a,x){return a+x.q},0);
  var porSexo={M:grupo(V.filter(function(x){return x.s==="M"})),F:grupo(V.filter(function(x){return x.s==="F"}))};
  var rac={};V.forEach(function(x){(rac[x.r]=rac[x.r]||[]).push(x)});var porRaca=Object.keys(rac).map(function(k){var o=grupo(rac[k]);o.nome=k;return o}).sort(function(a,b){return b.mk-a.mk});
  var porQuem=quem().map(function(n){var l=V.filter(function(x){return S.qm[x.l]===n});var o=grupo(l);o.nome=n;o.ls=l.map(function(x){return z(x.l)});return o});
  var sem=V.filter(function(x){return !S.qm[x.l]});if(sem.length){var o=grupo(sem);o.nome="Sem nome";o.ls=[];porQuem.push(o)}
  var faixa={g:0,y:0,o:0};V.forEach(function(x){var i=kgInfo(S.la[x.l],x);if(i)faixa[i.c]++});
  var comKg=V.filter(function(x){return kgInfo(S.la[x.l],x)}).sort(function(a,b){return kgInfo(S.la[b.l],b).k-kgInfo(S.la[a.l],a).k});
  var ret=grupo(R);
  return {V:V,R:R,g:g,cabT:cabT,porSexo:porSexo,porRaca:porRaca,porQuem:porQuem,faixa:faixa,melhores:comKg.slice(0,5),piores:comKg.slice(-5),ret:ret,falta:L.length-V.length-R.length};
}


/* ---------- comissão por cidade ---------- */
function pc(n){return (n==null?0:n).toLocaleString("pt-BR",{maximumFractionDigits:3})+"%"}
function salvaCM(){try{localStorage.setItem(KC,JSON.stringify(CM))}catch(e){}}
function cidadeDe(s){if(s.cidade)return s.cidade.replace(/-[A-Z]{2}$/,"");var m=/\s[–-]\s*([^–-]+)$/.exec(s.nome||"");return m?m[1].trim():""}
function com(){if(!S)return null;if(!S.doa)S.doa={};
  if(!S.com){var c=cidadeDe(S),sv=CM[slug(c)]||null;
    S.com={cidade:c,comp:sv?sv.comp:null,vend:sv?sv.vend:null,leil:sv&&sv.leil?sv.leil:LEILOEIROS[0].n,leilP:sv&&sv.leilP!=null?sv.leilP:LEILOEIROS[0].p,rural:sv&&sv.rural!=null?sv.rural:RURAL_PADRAO,piq:PIQ_PADRAO,eu:EU_PADRAO,daCidade:!!sv}}
  return S.com}
function calc(){var c=com(),o={bruto:0,doa:0,nDoa:0,cab:0};
  L.forEach(function(x){if(S.st[x.l]!=="V")return;var v=(S.la[x.l]||0)*3*x.q;o.bruto+=v;o.cab+=x.q;if(S.doa[x.l]){o.doa+=v;o.nDoa++}});
  o.base=o.bruto-o.doa;o.pc=(c.comp||0)/100;o.pv=(c.vend||0)/100;o.cComp=o.base*o.pc;o.cVend=o.base*o.pv;o.cTot=o.cComp+o.cVend;
  o.ruralP=c.rural==null?RURAL_PADRAO:c.rural;o.rural=o.cTot*o.ruralP/100;o.casa=o.cTot-o.rural;o.leil=o.base*(c.leilP||0)/100;o.liq=o.casa-o.leil;o.piq=o.liq*(c.piq||0)/100;o.sobra=o.liq-o.piq;o.eu=o.sobra*(c.eu||0)/100;
  o.efet=o.bruto?o.eu/o.bruto*100:0;o.semTaxa=c.comp==null&&c.vend==null;return o}

function comissao(m){$("pos").textContent="";var c=com(),K=calc(),cs=Object.keys(CM).map(function(k){return CM[k]}).sort(function(a,b){return a.cidade.localeCompare(b.cidade)});

async function carregaProx(){
  try{var j=await (await fetch("agenda.json?v="+Date.now(),{cache:"no-store"})).json();var hj=new Date();hj.setHours(0,0,0,0);
    var hoje=hj.getFullYear()+"-"+z(hj.getMonth()+1)+"-"+z(hj.getDate());

}
