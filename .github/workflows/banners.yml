name: Banners dos leilões
# Baixa duas vezes por dia o banner atual de cada leilão da Leiloingá (o site troca o endereço da imagem)
on:
  schedule:
    - cron: "17 11,17 * * *"   # 08h17 e 14h17 em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: banners
  cancel-in-progress: false
jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/ferramentas/banners.py
      - name: Salvar
        run: |
          if [ -n "$(git status --porcelain agenda.json banners)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add agenda.json banners
            git commit -m "Banners dos leilões atualizados"
            git pull --rebase origin main && git push
          fi
